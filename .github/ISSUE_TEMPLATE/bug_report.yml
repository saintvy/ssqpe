name: Bug report
description: Report a parsing or visualization problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach a production plan until SQL text, object names, literals, and runtime data have been reviewed and anonymized."
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 130, Edge 130, Firefox 132…"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal anonymized ShowPlan
      description: Paste a minimal synthetic plan or provide a link to an anonymized fixture.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed all attached plan data for sensitive information.
          required: true
