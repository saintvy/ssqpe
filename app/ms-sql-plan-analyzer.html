        }
      }
      const estimate = estimateInfo(node);
      if (estimate?.severity) {
        const factor = estimate.factor === Infinity ? '∞' : formatNumber(estimate.factor);
        const tip = t('badRowEstimate',{direction:t(estimate.direction === 'under' ? 'underDirection' : 'overDirection'),factor,estimated:formatNumber(estimate.estimated),actual:formatNumber(estimate.actual)});
        badges.push(`<span class="performance-badge severity-${estimate.severity}" tabindex="0" data-alert="rows" data-tip="${esc(tip)}" title="${esc(tip)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h7M6 8h7M6 12h7"></path><path d="M3 4h.01M3 8h.01M3 12h.01"></path></svg></span>`);
      }
      return badges.length ? `<span class="performance-badges">${badges.join('')}</span>` : '';
    }

    function directWithin(relop, tag) {
      return all(relop, tag).filter(el => {
        let p = el.parentElement;
        while (p && p !== relop && lname(p) !== 'RelOp') p = p.parentElement;
        return p === relop;
      });
    }

    function directChildRelOps(relop) {
      return all(relop, 'RelOp').filter(candidate => {
        let p = candidate.parentElement;
        while (p && lname(p) !== 'RelOp') p = p.parentElement;
        return p === relop;
      });
    }

    function nearestAncestor(el, name) {
      let p = el && el.parentElement;
      while (p && lname(p) !== name) p = p.parentElement;
      return p;
    }

    function nearestStatement(el) {
      let p = el && el.parentElement;
      while (p && !lname(p).startsWith('Stmt')) p = p.parentElement;
      return p;
    }

    function formatColumn(el) {
      const parts = [attr(el,'Database'), attr(el,'Schema'), attr(el,'Alias') || attr(el,'Table'), attr(el,'Column')].filter(Boolean);
      return parts.join('.').replace(/\]\./g, '].');
    }

    function objectLabel(relop) {
      const object = directWithin(relop, 'Object')[0];
      if (!object) return '';
      return ['Database','Schema','Table','Index'].map(k => attr(object, k)).filter(Boolean).join('.');
    }

    function runtimeAggregate(relop) {
      const counters = directWithin(relop, 'RunTimeCountersPerThread');
      if (!counters.length) return null;
      const sumKeys = ['ActualRows','ActualRowsRead','ActualCPUms','ActualLogicalReads','ActualPhysicalReads','ActualReadAheads','ActualLobLogicalReads','ActualLobPhysicalReads','ActualLobReadAheads','ActualScans','ActualRebinds','ActualRewinds','ActualExecutions','Batches','ActualEndOfScans'];
      const result = {
        threads: counters.length,
        threadRows: [],
        hasElapsed: counters.some(el => el.hasAttribute('ActualElapsedms')),
        hasCPU: counters.some(el => el.hasAttribute('ActualCPUms')),
        hasRows: counters.some(el => el.hasAttribute('ActualRows')),
        hasExecutions: counters.some(el => el.hasAttribute('ActualExecutions'))
      };
      sumKeys.forEach(k => result[k] = counters.reduce((sum, el) => sum + num(attr(el, k)), 0));
      result.ActualElapsedms = counters.reduce((max, el) => Math.max(max, num(attr(el, 'ActualElapsedms'))), 0);
      result.ActualExecutionsMax = counters.reduce((max, el) => Math.max(max, num(attr(el, 'ActualExecutions'))), 0);
      result.ActualExecutionMode = counters.map(el => attr(el, 'ActualExecutionMode')).find(Boolean) || '';
      result.threadRows = counters.map(el => ({
        Thread: attr(el, 'Thread'), ActualRows: attr(el, 'ActualRows'), ActualElapsedms: attr(el, 'ActualElapsedms'), ActualCPUms: attr(el, 'ActualCPUms'), ActualExecutions: attr(el, 'ActualExecutions'), ActualLogicalReads: attr(el, 'ActualLogicalReads')
      }));
      return result;
    }

    function extractExpressions(relop) {
      const values = [];
      directWithin(relop, 'ScalarOperator').forEach(el => {
        const text = attr(el, 'ScalarString');
        if (text && !values.includes(text)) values.push(text);
      });
      return values;
    }

    function extractWarnings(relop) {
      const warnings = [];
      directWithin(relop, 'Warnings').forEach(w => {
        if (w.attributes.length) warnings.push(Array.from(w.attributes).map(a => `${a.name}: ${a.value}`).join(', '));
        Array.from(w.children).forEach(child => {
          const details = Array.from(child.attributes).map(a => `${a.name}: ${a.value}`).join(', ');
          warnings.push(lname(child) + (details ? ` (${details})` : ''));
        });
      });
      return warnings;
    }

    function parseNode(relop, path, parent = null) {
      const runtime = runtimeAggregate(relop);
      const outputs = directWithin(relop, 'OutputList').flatMap(out => children(out, 'ColumnReference')).map(formatColumn).filter(Boolean);
      const defined = directWithin(relop, 'DefinedValue').flatMap(v => all(v, 'ColumnReference').filter(c => nearestAncestor(c, 'RelOp') === relop)).map(formatColumn).filter(Boolean);
      const object = directWithin(relop, 'Object')[0] || null;
      const physical = attr(relop, 'PhysicalOp', attr(relop, 'LogicalOp', 'RelOp'));
      const node = {
        id: path,
        nodeId: attr(relop, 'NodeId', path),
        physical,
        logical: attr(relop, 'LogicalOp'),
        estimatedRows: num(attr(relop, 'EstimateRows')),
        estimatedRowsRead: attr(relop, 'EstimatedRowsRead') ? num(attr(relop, 'EstimatedRowsRead')) : null,
        estimatedCost: num(attr(relop, 'EstimatedTotalSubtreeCost')),
        estimateCPU: num(attr(relop, 'EstimateCPU')),
        estimateIO: num(attr(relop, 'EstimateIO')),
        avgRowSize: num(attr(relop, 'AvgRowSize')),
        tableCardinality: attr(relop, 'TableCardinality') ? num(attr(relop, 'TableCardinality')) : null,
        estimateRebinds: num(attr(relop, 'EstimateRebinds')),
        estimateRewinds: num(attr(relop, 'EstimateRewinds')),
        parallel: bool(attr(relop, 'Parallel')),
        estimatedMode: attr(relop, 'EstimatedExecutionMode'),
        runtime,
        outputs,
        defined,
        expressions: extractExpressions(relop),
        warnings: extractWarnings(relop),
        object: object ? Object.fromEntries(Array.from(object.attributes).map(a => [a.name, a.value])) : {},
        objectLabel: objectLabel(relop),
        attributes: Object.fromEntries(Array.from(relop.attributes).map(a => [a.name, a.value])),
        memory: directWithin(relop, 'MemoryFractions').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))),
        spills: directWithin(relop, 'SpillToTempDb').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))),
        parent,
        children: [],
        el: relop,
        depth: parent ? parent.depth + 1 : 0,
        subtreeSize: 1,
        fingerprint: '',
        duplicateGroup: null,
        hiddenAsSubplan: false
      };
      node.children = directChildRelOps(relop).map((child, i) => parseNode(child, `${path}.${i}`, node));
      node.subtreeSize = 1 + node.children.reduce((s, c) => s + c.subtreeSize, 0);
      node.selfCost = Math.max(0, node.estimatedCost - node.children.reduce((s, c) => s + c.estimatedCost, 0));
      node.elapsed = runtime?.hasElapsed ? runtime.ActualElapsedms : null;
      const childCriticalElapsed = Math.max(0, ...node.children.map(child => child.subtreeElapsedEstimate));
      const executionMode = (runtime?.ActualExecutionMode || node.estimatedMode || 'Row').toLowerCase();
      if (node.elapsed === null) {
        node.selfTime = null;
        node.subtreeElapsedEstimate = childCriticalElapsed;
      } else if (executionMode === 'batch') {
        node.selfTime = node.elapsed;
        node.subtreeElapsedEstimate = node.elapsed + childCriticalElapsed;
      } else {
        node.selfTime = Math.max(0, node.elapsed - childCriticalElapsed);
        node.subtreeElapsedEstimate = Math.max(node.elapsed, childCriticalElapsed);
      }
      return node;
    }

    function fingerprintNode(node) {
      const objectIdentity = [node.object.Database,node.object.Schema,node.object.Table,node.object.Index].filter(Boolean).join('.').toLowerCase();
      const expressions = node.expressions.map(x => x.replace(/Expr\d+/gi, 'Expr#').replace(/\s+/g, ' ').toLowerCase()).sort().join('|');
      const childPrints = node.children.map(fingerprintNode).join(',');
      node.fingerprint = `${node.physical}|${node.logical}|${objectIdentity}|${expressions}|[${childPrints}]`;
      return node.fingerprint;
    }

    function flatten(roots) {
      const result = [];
      const walk = n => { result.push(n); n.children.forEach(walk); };
      roots.forEach(walk);
      return result;
    }

    function detectReusableSubplans(statement) {
      const nodes = flatten(statement.roots);
      statement.roots.forEach(fingerprintNode);
      const candidates = new Map();
      nodes.filter(n => n.subtreeSize >= 3).forEach(n => {
        if (!candidates.has(n.fingerprint)) candidates.set(n.fingerprint, []);
        candidates.get(n.fingerprint).push(n);
      });
      const repeated = Array.from(candidates.values()).filter(group => group.length > 1).sort((a,b) => b[0].subtreeSize - a[0].subtreeSize);
      const claimed = new Set();
      statement.subplans = [];
      repeated.forEach(group => {
        const usable = group.filter(n => {
          let p = n.parent;
          while (p) { if (claimed.has(p.id)) return false; p = p.parent; }
          return true;
        });
        if (usable.length < 2) return;
        const item = { id: `sp-${statement.subplans.length + 1}`, number: statement.subplans.length + 1, root: usable[0], calls: usable };
        statement.subplans.push(item);
        usable.forEach(n => { n.duplicateGroup = item; claimed.add(n.id); });
      });
    }

    function statementForPlan(planEl, index, batchText = '') {
      const stmt = nearestStatement(planEl);
      const queryPlan = planEl;
      const topRelOps = all(queryPlan, 'RelOp').filter(r => nearestAncestor(r, 'QueryPlan') === queryPlan && !nearestAncestor(r, 'RelOp'));
      const roots = topRelOps.map((r, i) => parseNode(r, `s${index}.r${i}`));
      const queryTimeStatsEl = children(queryPlan, 'QueryTimeStats')[0] || null;
      const memoryGrantEl = children(queryPlan, 'MemoryGrantInfo')[0] || null;
      const statement = {
        index,
        type: stmt ? attr(stmt, 'StatementType', lname(stmt).replace(/^Stmt/, '')) : '',
        text: stmt ? attr(stmt, 'StatementText') : '',
        batchText,
        id: stmt ? attr(stmt, 'StatementId', String(index + 1)) : String(index + 1),
        subtreeCost: stmt ? num(attr(stmt, 'StatementSubTreeCost')) : (roots[0]?.estimatedCost || 0),
        roots,
        queryPlan: Object.fromEntries(Array.from(queryPlan.attributes).map(a => [a.name, a.value])),
        queryTimeStats: queryTimeStatsEl ? Object.fromEntries(Array.from(queryTimeStatsEl.attributes).map(a => [a.name,a.value])) : {},
        memoryGrant: memoryGrantEl ? Object.fromEntries(Array.from(memoryGrantEl.attributes).map(a => [a.name,a.value])) : {},
        optimizerStats: first(queryPlan, 'OptimizerStatsUsage') ? all(first(queryPlan, 'OptimizerStatsUsage'),'StatisticsInfo').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))) : [],
        missingIndexes: extractMissingIndexes(queryPlan),
        subplans: []
      };
      detectReusableSubplans(statement);
      return statement;
    }

    function extractMissingIndexes(queryPlan) {
      return all(queryPlan, 'MissingIndexGroup').map(group => ({
        impact: attr(group, 'Impact'),
        indexes: children(group, 'MissingIndex').map(idx => ({
          table: ['Database','Schema','Table'].map(k => attr(idx,k)).filter(Boolean).join('.'),
          columns: all(idx, 'Column').map(c => `${attr(c,'Name')} (${attr(c.parentElement,'Usage') || 'COLUMN'})`)
        }))
      }));
    }

    function parseShowPlan(xmlText, fileName = t('defaultPlan')) {
      const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
      const error = all(xml, 'parsererror')[0];
      if (error) throw new Error(t('xmlParseError', { details: shortText(error.textContent, 180) }));
      const root = xml.documentElement;
      if (!root || lname(root) !== 'ShowPlanXML') throw new Error(t('expectedShowPlan'));
      const queryPlans = all(xml, 'QueryPlan').filter(q => !nearestAncestor(q, 'QueryPlan'));
      const statementEls = Array.from(xml.getElementsByTagNameNS('*','*')).filter(el => lname(el).startsWith('Stmt'));
      const batches = all(xml, 'Batch').filter(batch => !nearestAncestor(batch, 'Batch'));
      const batchTexts = new Map(batches.map(batch => [batch, statementEls
        .filter(stmt => nearestAncestor(stmt, 'Batch') === batch)
        .map(stmt => attr(stmt, 'StatementText'))
        .filter(text => text.trim())
        .join('\n\n')]));
      const looseText = statementEls.map(stmt => attr(stmt, 'StatementText')).filter(text => text.trim()).join('\n\n');
      const batchTextFor = stmt => stmt ? (batchTexts.get(nearestAncestor(stmt, 'Batch')) || attr(stmt, 'StatementText')) : looseText;
      const statements = [];
      statementEls.forEach(stmt => {
        const ownedPlans = queryPlans.filter(q => nearestStatement(q) === stmt);
        if (ownedPlans.length) {
          ownedPlans.forEach(q => statements.push(statementForPlan(q, statements.length, batchTextFor(stmt))));
        } else {
          statements.push({ index: statements.length, type: attr(stmt,'StatementType',lname(stmt).replace(/^Stmt/,'')), text: attr(stmt,'StatementText'), batchText: batchTextFor(stmt), id: attr(stmt,'StatementId',String(statements.length+1)), subtreeCost: num(attr(stmt,'StatementSubTreeCost')), roots: [], queryPlan:{}, queryTimeStats:{}, memoryGrant:{}, optimizerStats:[], missingIndexes:[], subplans:[] });
        }
      });
      queryPlans.filter(q => !nearestStatement(q)).forEach(q => statements.push(statementForPlan(q, statements.length, looseText)));
      if (!statements.length) throw new Error(t('noStatements'));
      const completeSum = values => values.length && values.every(value => value !== null) ? values.reduce((sum, value) => sum + value, 0) : null;
      const executionTimeMs = completeSum(statements.map(statement => optionalNumber(statement.queryTimeStats.ElapsedTime)));
      const compileTimeMs = completeSum(statements.map(statement => optionalNumber(statement.queryPlan.CompileTime)));
      const memoryPeaks = statements.map(statement => optionalNumber(statement.memoryGrant.MaxUsedMemory)).filter(value => value !== null);
      const plan = {
        name: fileName.replace(/\.(sqlplan|sqplan|xml)$/i, ''),
        version: attr(root, 'Version'),
        build: attr(root, 'Build'),
        statements,
        nodeCount: statements.reduce((sum,s) => sum + flatten(s.roots).length, 0),
        actual: statements.some(s => optionalNumber(s.queryTimeStats.ElapsedTime) !== null || flatten(s.roots).some(n => n.runtime)),
        summary: {
          executionTimeMs,
          compileTimeMs,
          peakMemoryKb: memoryPeaks.length ? Math.max(...memoryPeaks) : null
        }
      };
      return plan;
    }

    const historyStore = (() => {
      let dbPromise;
      function db() {
        if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
        if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('sql-server-plan-explorer', 1);
          req.onupgradeneeded = () => {
            const store = req.result.createObjectStore('plans', { keyPath: 'id' });
            store.createIndex('openedAt', 'openedAt');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return dbPromise;
      }
      async function tx(mode, fn) {
        const database = await db();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction('plans', mode);
          const store = transaction.objectStore('plans');
          const request = fn(store);
          transaction.oncomplete = () => resolve(request && request.result);
          transaction.onerror = () => reject(transaction.error);
        });
      }
      const fallbackKey = 'sql-server-plan-explorer-history';
      return {
        async list() {
          try { const items = await tx('readonly', s => s.getAll()); return (items || []).sort((a,b) => b.openedAt - a.openedAt); }
          catch { try { return JSON.parse(localStorage.getItem(fallbackKey) || '[]'); } catch { return []; } }
        },
        async save(item) {
          try { await tx('readwrite', s => s.put(item)); }
          catch { const items = await this.list(); const next = [item, ...items.filter(x => x.id !== item.id)].slice(0,10); localStorage.setItem(fallbackKey, JSON.stringify(next)); }
        },
        async remove(id) {
          try { await tx('readwrite', s => s.delete(id)); }
          catch { const items = await this.list(); localStorage.setItem(fallbackKey, JSON.stringify(items.filter(x => x.id !== id))); }
        },
        async clear() {
          try { await tx('readwrite', s => s.clear()); }
          catch { localStorage.removeItem(fallbackKey); }
        }
      };
    })();

    async function hashText(text) {
      if (crypto.subtle) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(digest)).slice(0,12).map(b => b.toString(16).padStart(2,'0')).join('');
      }
      let h = 2166136261;
      for (let i=0;i<text.length;i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
      return String(h >>> 0);
    }

    async function loadXml(xml, fileName, save = true) {
      const parsed = parseShowPlan(xml, fileName);
      state.plan = parsed;
      state.currentFile = fileName;
      state.currentXml = xml;
      state.statementIndex = 0;
      state.selectedId = null;
      state.collapsedIds.clear();
      state.zoom = 1;
      state.screen = 'viewer';
      els.emptyState.classList.add('hidden');
      els.viewer.classList.add('visible');
      els.homeSidebar.classList.add('hidden');
      els.planSidebar.classList.remove('hidden');
      els.menuBtn.classList.remove('hidden');
      els.historyBtn.classList.remove('hidden');
      els.detailsHandle.classList.toggle('visible', state.detailsLocked);
      els.detailsDrawer.classList.remove('open');
      updateZoom();
      renderAll();
      const initialRootId = parsed.statements[0].roots[0]?.id;
      if (initialRootId) requestAnimationFrame(() => centerGraphNode(initialRootId, 'auto'));
      if (save) {
        try {
          const id = await hashText(xml);
          await historyStore.save({ id, name: fileName, xml, openedAt: Date.now(), nodeCount: parsed.nodeCount, statements: parsed.statements.length, actual: parsed.actual });
          await refreshHistory();
        } catch (err) { toast(t('planSaveFailed'), true); }
      }
      toast(t('planOpened', { nodes: parsed.nodeCount }));
    }

    function currentStatement() { return state.plan?.statements[state.statementIndex] || null; }
    function currentNodes() { const s = currentStatement(); return s ? flatten(s.roots) : []; }
    function selectedNode() { return currentNodes().find(n => n.id === state.selectedId) || null; }

    function renderAll() {
      renderHeader();
      renderTabs();
      renderTree();
      renderGraph();
      const node = selectedNode();
      if (node) renderDetails(node);
    }

    function renderHeader() {
      const p = state.plan;
      els.planTitle.textContent = p.name;
      els.planMeta.innerHTML = `${esc(p.actual ? t('actualPlan') : t('estimatedPlan'))} · ${p.statements.length} ${esc(t('statementsShort'))} · ${p.nodeCount} ${esc(t('nodesShort'))}${p.build ? ` · <span title="${esc(t('buildHint'))}">${esc(t('sqlServerBuild'))} ${esc(p.build)}</span>` : ''}`;
      const stats = [
        [t('totalExecutionTime'), p.summary.executionTimeMs === null ? null : formatMs(p.summary.executionTimeMs), t('totalExecutionTimeHint')],
        [t('planningTime'), p.summary.compileTimeMs === null ? null : formatMs(p.summary.compileTimeMs), t('planningTimeHint')],
        [t('peakQueryMemory'), p.summary.peakMemoryKb === null ? null : formatBytes(p.summary.peakMemoryKb), t('peakQueryMemoryHint')]
      ].filter(([,value]) => value !== null);
      els.planStats.innerHTML = stats.map(([label,value,title]) => `<span class="plan-stat"${title ? ` title="${esc(title)}"` : ''}><b>${esc(label)}:</b> ${esc(value)}</span>`).join('');
    }

    function renderTabs() {
      const statements = state.plan.statements;
      els.statementTabs.classList.toggle('hidden', statements.length <= 1);
      els.statementTabs.innerHTML = statements.map((s,i) => `<button class="statement-tab ${i===state.statementIndex?'active':''}" data-index="${i}" title="${esc(shortText(s.text,180))}">${esc(t('queryNumber',{number:i+1}))} · ${esc(s.type || t('query'))}</button>`).join('');
    }

    function metricValues(node) {
      return { subtree: node.estimatedCost, self: node.selfCost };
    }

    function visibleTreeNodes(roots) {
      const result = [];
      const visit = node => {
        result.push(node);
        if (!state.collapsedIds.has(node.id)) node.children.forEach(visit);
      };
      roots.forEach(visit);
      return result;
    }

    function treeToggle(n) {
      if (!n.children.length) return '';
      const collapsed = state.collapsedIds.has(n.id);
      const label = t(collapsed ? 'expandSubtree' : 'collapseSubtree');
      return `<button class="tree-toggle" data-toggle="${esc(n.id)}" aria-expanded="${!collapsed}" title="${esc(label)}" aria-label="${esc(label)}">${collapsed?'▸':'▾'}</button>`;
    }

    function rowsBarSegments(estimated, actual, maximum, severity) {
      const width = value => Math.min(100, Math.max(0, 100 * value / maximum));
      const estimateWidth = width(estimated);
      if (actual === null) return `<span class="rows-segment rows-estimate severity-${severity}" data-series="estimate" style="left:0;width:${estimateWidth}%"></span>`;
      const actualWidth = width(actual);
      if (actual === estimated) return `<span class="rows-segment rows-actual severity-${severity}" data-series="actual" style="left:0;width:${actualWidth}%"></span>`;
      if (actual > estimated) return `<span class="rows-segment rows-estimate severity-${severity}" data-series="estimate" style="left:0;width:${estimateWidth}%"></span><span class="rows-segment rows-actual severity-${severity}" data-series="actual" style="left:${estimateWidth}%;width:${actualWidth-estimateWidth}%"></span>`;
      return `<span class="rows-segment rows-actual severity-${severity}" data-series="actual" style="left:0;width:${actualWidth}%"></span><span class="rows-segment rows-estimate severity-${severity}" data-series="estimate" style="left:${actualWidth}%;width:${estimateWidth-actualWidth}%"></span>`;
    }

    function renderTree() {
      const s = currentStatement();
      els.expandAllBtn.disabled = state.collapsedIds.size === 0;
      if (!s || !s.roots.length) {
        els.tree.innerHTML = `<div style="padding:20px;color:var(--muted)">${esc(t('noStatementGraph'))}</div>`;
        els.metricNotice.textContent = '';
        return;
      }
      const allNodes = flatten(s.roots);
      const nodes = visibleTreeNodes(s.roots);
      const timeMissing = state.metric === 'time' && !allNodes.some(n => n.runtime?.hasElapsed);
      if (state.metric === 'time') els.metricNotice.innerHTML = `${timeMissing?`<span>${esc(t('timeUnavailable'))}</span>`:''}<span class="rows-legend"><span><i class="metric-dot" style="background:#246653"></i>${esc(t('actualTime'))}</span><span><i class="metric-dot" style="background:var(--time)"></i>${esc(t('exclusiveTime'))}</span></span>`;
      else if (state.metric === 'rows') els.metricNotice.innerHTML = `<span class="rows-legend"><span><i class="metric-dot" style="background:#4fd0a4"></i>${esc(t('closeShort'))}</span><span><i class="metric-dot" style="background:#fddb61"></i>${esc(t('rowSeverity2'))}</span><span><i class="metric-dot" style="background:#ee8800"></i>${esc(t('rowSeverity3'))}</span><span><i class="metric-dot" style="background:#ff5964"></i>${esc(t('rowSeverity4'))}</span></span>`;
      else els.metricNotice.textContent = '';
      const maximum = state.metric === 'rows'
        ? Math.max(...allNodes.flatMap(n => [n.estimatedRows, actualRowsPerExecution(n) || 0]), 0.0000001)
        : state.metric === 'time'
          ? Math.max(...allNodes.flatMap(n => [n.runtime?.hasElapsed ? n.runtime.ActualElapsedms : 0, n.selfTime || 0]), 0.0000001)
        : Math.max(...s.roots.map(r => metricValues(r).subtree || 0), ...allNodes.map(n => metricValues(n).subtree || 0), 0.0000001);
      const rows = nodes.map(n => {
        if (state.metric === 'rows') {
          const estimated = n.estimatedRows;
          const hasActual = Boolean(n.runtime?.hasRows);
          const actual = hasActual ? actualRowsPerExecution(n) : null;
          const estimate = estimateInfo(n);
          const severity = estimate?.severity || 0;
          const accuracyText = actual === null ? t('noActualRows') : t(actual > estimated ? 'underestimated' : actual < estimated ? 'overestimated' : 'closeEstimate');
          return `<div class="tree-row ${n.id===state.selectedId?'selected':''}" data-id="${esc(n.id)}" style="--depth:${n.depth}">
            ${treeToggle(n)}
            <div class="tree-name"><span class="tree-op">${n.duplicateGroup?'<span class="call-mark">↗</span>':''}${esc(n.physical)}</span><span class="tree-object">${esc(n.objectLabel || n.logical || '')}</span></div>
            <div class="tree-metrics"><div class="tree-bar" title="${esc(t('estimate'))}: ${esc(formatNumber(estimated))}; ${esc(t('actual'))}: ${actual===null?t('missing'):esc(formatNumber(actual))}. ${esc(accuracyText)}">${rowsBarSegments(estimated,actual,maximum,severity)}</div>
            <div class="tree-value" title="${esc(t('estimate'))} / ${esc(t('actual'))}">${formatNumber(estimated)} / ${actual===null?t('missing'):formatNumber(actual)}</div></div>
          </div>`;
        }
        if (state.metric === 'time') {
          const hasElapsed=Boolean(n.runtime?.hasElapsed),hasCurrent=n.selfTime!==null;
          const elapsed=hasElapsed?n.runtime.ActualElapsedms:null,current=n.selfTime;
          const elapsedWidth=hasElapsed?Math.min(100,100*elapsed/maximum):0,currentWidth=hasCurrent?Math.min(100,100*current/maximum):0;
          return `<div class="tree-row ${n.id===state.selectedId?'selected':''}" data-id="${esc(n.id)}" style="--depth:${n.depth}">
            ${treeToggle(n)}
            <div class="tree-name"><span class="tree-op">${n.duplicateGroup?'<span class="call-mark">↗</span>':''}${esc(n.physical)}</span><span class="tree-object">${esc(n.objectLabel || n.logical || '')}</span></div>
            <div class="tree-metrics"><div class="tree-bar" title="${esc(t('actualTime'))}: ${esc(formatMs(elapsed))}; ${esc(t('exclusiveTime'))}: ${esc(formatMs(current))}">${hasElapsed?`<span class="time-elapsed" data-series="elapsed" style="width:${elapsedWidth}%"></span>`:''}${hasCurrent?`<span class="time-current" data-series="current" style="width:${currentWidth}%"></span>`:''}</div>
            <div class="tree-value" title="${esc(t('exclusiveTime'))}">${esc(formatMs(current))}</div></div>
          </div>`;
        }
        const v = metricValues(n);
        const subWidth = Math.min(100, 100 * (v.subtree || 0) / maximum);
        const selfWidth = Math.min(subWidth, 100 * (v.self || 0) / maximum);
        const subtreeValue = formatNumber(v.subtree);
        const value = subtreeValue;
        return `<div class="tree-row ${n.id===state.selectedId?'selected':''}" data-id="${esc(n.id)}" style="--depth:${n.depth}">
          ${treeToggle(n)}
          <div class="tree-name"><span class="tree-op">${n.duplicateGroup?'<span class="call-mark">↗</span>':''}${esc(n.physical)}</span><span class="tree-object">${esc(n.objectLabel || n.logical || '')}</span></div>
          <div class="tree-metrics"><div class="tree-bar" title="${esc(t('subtree'))}: ${esc(subtreeValue)}; ${esc(t('selfCost'))}: ${esc(formatNumber(v.self))}"><span class="subtree" style="width:${subWidth}%;background:var(--cost)"></span><span class="self" style="width:${selfWidth}%;background:var(--cost)"></span></div>
          <div class="tree-value" title="${esc(t('subtree'))}">${esc(value)}</div></div>
        </div>`;
      }).join('');
      const contentWidth = 390 + Math.max(0, ...nodes.map(n => n.depth)) * 15;
      els.tree.innerHTML = `<div class="tree-content" style="width:${contentWidth}px">${rows}</div>`;
      $$('#metricSwitch button', els.metricSwitch).forEach(b => b.classList.toggle('active', b.dataset.metric === state.metric));
    }

    function layoutGraph(statement) {
      const cardW = 220, cardH = 106, cardMaxW = 278, cardMaxH = 158;
      const levelStep = 190, siblingGap = 36, forestGap = 72, padX = 50, padY = 36;
      const halfCard = cardMaxW / 2;
      const visibleChildren = node => node.duplicateGroup ? [] : node.children;

      // Reingold-Tilford-style contour packing: siblings move only enough for
      // their occupied horizontal contours to clear at every shared depth.
      function tidySubtree(node, childSelector) {
        const childLayouts = childSelector(node).map(child => tidySubtree(child, childSelector));
        if (!childLayouts.length) return { entries:[{node,x:0,depth:0}], left:[-halfCard], right:[halfCard] };
        const combinedLeft = [], combinedRight = [], placements = [];
        childLayouts.forEach((layout, index) => {
          let shift = 0;
          if (index) {
            layout.left.forEach((left, depth) => {
              if (combinedRight[depth] !== undefined) shift = Math.max(shift, combinedRight[depth] + siblingGap - left);
            });
          }
          placements.push(shift);
          layout.left.forEach((left, depth) => {
            const shiftedLeft = left + shift, shiftedRight = layout.right[depth] + shift;
            combinedLeft[depth] = combinedLeft[depth] === undefined ? shiftedLeft : Math.min(combinedLeft[depth], shiftedLeft);
            combinedRight[depth] = combinedRight[depth] === undefined ? shiftedRight : Math.max(combinedRight[depth], shiftedRight);
          });
        });
        const parentX = (placements[0] + placements[placements.length - 1]) / 2;
        const entries = [{node,x:0,depth:0}];
        childLayouts.forEach((layout, index) => layout.entries.forEach(entry => entries.push({node:entry.node,x:entry.x+placements[index]-parentX,depth:entry.depth+1})));
        return {
          entries,
          left:[-halfCard,...combinedLeft.map(value => value-parentX)],
          right:[halfCard,...combinedRight.map(value => value-parentX)]
        };
      }

      function packForest(layouts, gap) {
        const combinedLeft = [], combinedRight = [], entries = [];
        layouts.forEach((layout, index) => {
          let shift = 0;
          if (index) layout.left.forEach((left, depth) => {
            if (combinedRight[depth] !== undefined) shift = Math.max(shift, combinedRight[depth] + gap - left);
          });
          layout.entries.forEach(entry => entries.push({node:entry.node,x:entry.x+shift,depth:entry.depth}));
          layout.left.forEach((left, depth) => {
            const shiftedLeft=left+shift,shiftedRight=layout.right[depth]+shift;
            combinedLeft[depth]=combinedLeft[depth]===undefined?shiftedLeft:Math.min(combinedLeft[depth],shiftedLeft);
            combinedRight[depth]=combinedRight[depth]===undefined?shiftedRight:Math.max(combinedRight[depth],shiftedRight);
          });
        });
        return {entries,left:combinedLeft,right:combinedRight};
      }

      function assignPositions(layout, property, left, top) {
        const minX = Math.min(...layout.entries.map(entry => entry.x-halfCard));
        const offsetX = left-minX;
        layout.entries.forEach(entry => entry.node[property]={x:entry.x+offsetX-cardW/2,y:top+entry.depth*levelStep});
        return {
          right:Math.max(...layout.entries.map(entry => entry.x+offsetX+halfCard)),
          bottom:Math.max(...layout.entries.map(entry => top+entry.depth*levelStep+cardMaxH))
        };
      }

      const mainLayout = packForest(statement.roots.map(root => tidySubtree(root, visibleChildren)), forestGap);
      const mainBounds = assignPositions(mainLayout, '_layout', padX, padY);
      const mainNodes = flatten(statement.roots).filter(n => {
        let p=n.parent; while(p){ if(p.duplicateGroup) return false; p=p.parent; } return true;
      });
      let maxRight = mainBounds.right + 50;
      const mainBottom = mainBounds.bottom;
      const subplans = [];
      let subY = mainBottom + (statement.subplans.length ? 70 : 0);
      statement.subplans.forEach(sp => {
        const nodes = flatten([sp.root]);
        const zoneX = 24, contentTop = subY + 52;
        const bounds=assignPositions(tidySubtree(sp.root,node=>node.children),'_subLayout',zoneX+50,contentTop);
        const bottom=bounds.bottom+28;
        const right=bounds.right+50;
        subplans.push({sp,nodes,x:zoneX,y:subY,width:right-zoneX,height:bottom-subY,bottom});
        maxRight=Math.max(maxRight,right);
        subY=bottom+30;
      });
      return { mainNodes, subplans, width:maxRight+30, height:Math.max(mainBottom+60,subY+20), cardW, cardH };
    }

    function edgePath(a, b, cardW, cardH) {
      const x1=a.x+cardW/2, y1=a.y+cardH, x2=b.x+cardW/2, y2=b.y, mid=(y1+y2)/2;
      return `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
    }

    function nodeCard(n, pos, sub = false, executionTime = 0) {
      const actualRows = actualRowsPerExecution(n);
      const subtitle = n.objectLabel || (n.expressions[0] ? shortText(n.expressions[0],70) : n.logical);
      const flags = [
        n.warnings.length?`<span class="flag warn" tabindex="0" data-tip="${esc(t('flagWarning'))}" title="${esc(t('flagWarning'))}" aria-label="${esc(t('flagWarning'))}">!</span>`:'',
        n.parallel?`<span class="flag parallel" tabindex="0" data-tip="${esc(t('flagParallel'))}" title="${esc(t('flagParallel'))}" aria-label="${esc(t('flagParallel'))}">∥</span>`:'',
        (n.estimatedMode==='Batch'||n.runtime?.ActualExecutionMode==='Batch')?`<span class="flag batch" tabindex="0" data-tip="${esc(t('flagBatch'))}" title="${esc(t('flagBatch'))}" aria-label="${esc(t('flagBatch'))}">B</span>`:''
      ].join('');
      const call = !sub && n.duplicateGroup;
      const subplanName = n.duplicateGroup ? t('reusableSubplan',{number:n.duplicateGroup.number}) : '';
      const visualX = pos.x - (n.id===state.selectedId ? 29 : 0);
      return `<article class="node-card ${n.id===state.selectedId?'selected expanded':''} ${n.warnings.length?'warning':''} ${call?'call-node':''}" data-id="${esc(n.id)}" data-node-id="${esc(n.nodeId)}" data-subplan="${sub}" style="left:${visualX}px;top:${pos.y}px" title="${esc(t('clickNode'))}">
        <div class="node-top"><div class="node-title">${call?'↗ ':''}${esc(call ? subplanName : n.physical)}</div><div class="node-id">${performanceBadges(n,executionTime)}<span>#${esc(n.nodeId)}</span></div></div>
        <div class="node-subtitle">${esc(call ? n.physical + (subtitle?' · '+subtitle:'') : subtitle || n.logical || '—')}</div><div class="node-flags">${flags}</div>
        <div class="node-stats"><div class="stat"><div class="stat-label">${esc(t('rowsEstimateActual'))}</div><div class="stat-value">${formatNumber(n.estimatedRows)} / ${actualRows===null?t('missing'):formatNumber(actualRows)}</div></div><div class="stat"><div class="stat-label">${esc(t('timeCost'))}</div><div class="stat-value">${formatMs(n.selfTime)} / ${formatNumber(n.selfCost)}</div></div></div>
        <div class="node-expanded"><div class="expanded-grid"><div class="expanded-item"><b>${esc(t('actualCpuTime'))}</b><span>${n.runtime?.hasCPU?formatMs(n.runtime.ActualCPUms):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('logicalReads'))}</b><span>${n.runtime?formatNumber(n.runtime.ActualLogicalReads):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('executions'))}</b><span>${n.runtime?formatNumber(n.runtime.ActualExecutions):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('outputColumns'))}</b><span>${formatNumber(n.outputs.length)}</span></div></div></div>
      </article>`;
    }

    const GRAPH_EDGE_GAP = 24;

    function graphDetailsInset() {
      return els.detailsDrawer.classList.contains('open') ? els.detailsDrawer.offsetWidth : 0;
    }

    function updateGraphViewport() {
      const layout = state.layout;
      if (!layout) {
        els.graphStage.style.width = '100%';
        els.graphStage.style.height = '100%';
        return;
      }
      const baseWidth = Math.max(layout.width, els.graph.scrollWidth);
      const baseHeight = Math.max(layout.height, els.graph.scrollHeight);
      const width = Math.max(els.canvasWrap.clientWidth, Math.ceil(baseWidth * state.zoom + graphDetailsInset() + GRAPH_EDGE_GAP));
      const height = Math.max(els.canvasWrap.clientHeight, Math.ceil(baseHeight * state.zoom + GRAPH_EDGE_GAP));
      els.graphStage.style.width = `${width}px`;
      els.graphStage.style.height = `${height}px`;
    }

    function renderGraph() {
      const s = currentStatement();
      if (!s || !s.roots.length) {
        state.layout = null;
        els.graph.innerHTML = `<div style="padding:30px;color:var(--muted)">${esc(t('noGraphFromServer'))}</div>`;
        els.graph.style.width='100%'; els.graph.style.height='100%'; updateGraphViewport(); return;
      }
      const layout = state.layout = layoutGraph(s);
      const executionTime = statementExecutionTime(s);
      const edges=[];
      layout.mainNodes.forEach(n => {
        if(n.parent && layout.mainNodes.includes(n.parent) && !n.parent.duplicateGroup) edges.push(`<path class="edge" d="${edgePath(n.parent._layout,n._layout,layout.cardW,layout.cardH)}"/>`);
      });
      layout.subplans.forEach(zone => {
        zone.nodes.forEach(n => { if(n.parent && zone.nodes.includes(n.parent)) edges.push(`<path class="edge" d="${edgePath(n.parent._subLayout,n._subLayout,layout.cardW,layout.cardH)}"/>`); });
        zone.sp.calls.forEach(call => {
          const a=call._layout,b=zone.sp.root._subLayout;
          if(a) edges.push(`<path class="edge call" d="${edgePath(a,b,layout.cardW,layout.cardH)}"/>`);
        });
      });
      const zones=layout.subplans.map(z=>`<div class="subplan-zone" style="left:${z.x}px;top:${z.y}px;width:${z.width}px;height:${z.height}px"><div class="subplan-label">↗ ${esc(t('reusableSubplan',{number:z.sp.number}))} · ${z.sp.calls.length} ${esc(t('calls'))}</div></div>`).join('');
      const mainCards=layout.mainNodes.map(n=>nodeCard(n,n._layout,false,executionTime)).join('');
      const subCards=layout.subplans.flatMap(z=>z.nodes.map(n=>nodeCard(n,n._subLayout,true,executionTime))).join('');
      els.graph.style.width=layout.width+'px'; els.graph.style.height=layout.height+'px';
      els.graph.innerHTML=`${zones}<svg class="edges" width="${layout.width}" height="${layout.height}" aria-hidden="true">${edges.join('')}</svg>${mainCards}${subCards}`;
      updateGraphViewport();
      const selected=$(`.node-card[data-id="${CSS.escape(state.selectedId || '')}"]`,els.graph);
      if(selected) selected.classList.add('expanded');
      const queryText = s.batchText || s.text;
      const meaningfulQuery = Boolean(queryText && !/^Statement\d+$/i.test(queryText.trim()));
      els.queryBtn.disabled = !meaningfulQuery;
      els.queryBtn.textContent = meaningfulQuery ? t('showQuery') : t('queryUnavailable');
      els.queryBtn.title = meaningfulQuery ? shortText(queryText,240) : t('queryUnavailable');
    }

    function detailRows(entries, formatter = v => v) {
      return entries.filter(([,v]) => v !== '' && v !== null && v !== undefined).map(([k,v]) => `<div class="kv"><div class="k">${esc(k)}</div><div>${esc(formatter(v,k))}</div></div>`).join('');
    }

    function detailTsv(entries) {
      const cell = value => String(value).replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
      return entries.filter(([,v]) => v !== '' && v !== null && v !== undefined).map(([k,v]) => `${cell(k)}\t${cell(v)}`).join('\n');
    }

    function detailCopyButton(copies, value) {
      if (!value) return '';
      const key = String(copies.size);
      copies.set(key, value);
      const label = t('copySection');
      return `<button type="button" class="detail-copy-button" data-copy-detail="${key}" title="${esc(label)}" aria-label="${esc(label)}"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="3" width="8" height="10" rx="1"></rect><path d="M3 11H2.5A1.5 1.5 0 0 1 1 9.5v-7A1.5 1.5 0 0 1 2.5 1h6A1.5 1.5 0 0 1 10 2.5V3"></path></svg></button>`;
    }

    function detailHeading(title, copies, value) {
      return `<div class="detail-heading"><h3>${esc(title)}</h3>${detailCopyButton(copies, value)}</div>`;
    }

    function detailSummary(title, copies, value) {
      return `<summary><span>${esc(title)}</span>${detailCopyButton(copies, value)}</summary>`;
    }

    function renderDetails(n) {
      els.drawerTitle.textContent = n.physical;
      els.drawerSubtitle.textContent = `${n.logical || t('operator')} · NodeId ${n.nodeId}${n.objectLabel?' · '+n.objectLabel:''}`;
      const actual = n.runtime;
      const actualRows = actualRowsPerExecution(n);
      const primary = [
        [t('estimatedRows'), formatNumber(n.estimatedRows)], [t('actualRows'), actualRows === null ? t('missing') : formatNumber(actualRows)],
        [t('actualRowsAllExecutions'), actual?.hasRows ? formatNumber(actual.ActualRows) : t('missing')],
        [t('actualTime'), actual?.hasElapsed ? formatMs(actual.ActualElapsedms) : t('missing')], [t('exclusiveTime'), n.selfTime === null ? t('missing') : '≈ ' + formatMs(n.selfTime)], [t('actualCpuTime'), actual?.hasCPU ? formatMs(actual.ActualCPUms) : t('missing')],
        [t('subtreeCost'), formatNumber(n.estimatedCost)], [t('selfCost'), formatNumber(n.selfCost)],
        [t('executions'), actual ? formatNumber(actual.ActualExecutions) : t('missing')], [t('mode'), actual?.ActualExecutionMode || n.estimatedMode || 'Row']
      ];
      const io = actual ? [
        [t('logicalReads'),formatNumber(actual.ActualLogicalReads)],[t('physicalReads'),formatNumber(actual.ActualPhysicalReads)],[t('readAhead'),formatNumber(actual.ActualReadAheads)],
        [t('lobLogicalReads'),formatNumber(actual.ActualLobLogicalReads)],[t('lobPhysicalReads'),formatNumber(actual.ActualLobPhysicalReads)],[t('scans'),formatNumber(actual.ActualScans)]
      ] : [];
      const estimates = [['Estimate CPU',formatNumber(n.estimateCPU)],['Estimate IO',formatNumber(n.estimateIO)],[t('averageRowSize'),formatNumber(n.avgRowSize)+' B'],[t('estimatedRowsRead'),n.estimatedRowsRead===null?t('missing'):formatNumber(n.estimatedRowsRead)],[t('tableCardinality'),n.tableCardinality===null?t('missing'):formatNumber(n.tableCardinality)],['Rebinds / Rewinds',`${formatNumber(n.estimateRebinds)} / ${formatNumber(n.estimateRewinds)}`]];
      const objectRows = Object.entries(n.object);
      const attributeRows = Object.entries(n.attributes).filter(([k]) => !['NodeId','PhysicalOp','LogicalOp','EstimateRows','EstimatedTotalSubtreeCost','EstimateCPU','EstimateIO'].includes(k));
      const threadTables = actual?.threadRows.map(row=>[[t('thread'),row.Thread],[t('rows'),row.ActualRows],[t('elapsed'),row.ActualElapsedms?formatMs(row.ActualElapsedms):t('missing')],[t('actualCpuTime'),row.ActualCPUms?formatMs(row.ActualCPUms):t('missing')],[t('logicalReads'),row.ActualLogicalReads||t('missing')]]) || [];
      const copies = new Map();
      els.drawerBody.innerHTML = `
        <section class="detail-section">${detailHeading(t('primaryMetrics'),copies,detailTsv(primary))}${detailRows(primary)}${actual?.hasElapsed?`<div class="detail-note">${esc(t('exclusiveTimeExplanation'))}</div>`:''}</section>
        ${io.length?`<section class="detail-section">${detailHeading(t('ioAndCache'),copies,detailTsv(io))}${detailRows(io)}</section>`:''}
        ${n.warnings.length?`<section class="detail-section">${detailHeading(t('warnings'),copies,n.warnings.join('\n'))}<div class="chip-list">${n.warnings.map(x=>`<span class="chip" style="border-color:#705e2b;color:#f4d77c">${esc(x)}</span>`).join('')}</div></section>`:''}
        ${objectRows.length?`<section class="detail-section">${detailHeading(t('object'),copies,detailTsv(objectRows))}${detailRows(objectRows)}</section>`:''}
        ${n.expressions.length?`<details class="detail-section detail-collapsible">${detailSummary(t('operandsPredicates'),copies,n.expressions.join('\n'))}<div class="detail-content">${n.expressions.map(x=>`<div class="expression">${esc(x)}</div>`).join('')}</div></details>`:''}
        ${n.outputs.length?`<details class="detail-section detail-collapsible">${detailSummary(`${t('outputColumns')} (${n.outputs.length})`,copies,n.outputs.join('\n'))}<div class="detail-content chip-list">${n.outputs.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></details>`:''}
        ${n.defined.length?`<details class="detail-section detail-collapsible">${detailSummary(t('definedValues'),copies,n.defined.join('\n'))}<div class="detail-content chip-list">${n.defined.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></details>`:''}
        <section class="detail-section">${detailHeading(t('optimizerEstimates'),copies,detailTsv(estimates))}${detailRows(estimates)}</section>
        ${n.spills.length?`<section class="detail-section">${detailHeading('Spill to tempdb',copies,n.spills.map(x=>detailTsv(Object.entries(x))).join('\n\n'))}${n.spills.map(x=>detailRows(Object.entries(x))).join('')}</section>`:''}
        <section class="detail-section">${detailHeading(t('showPlanAttributes'),copies,detailTsv(attributeRows))}${detailRows(attributeRows)}</section>
        ${threadTables.length>1?`<section class="detail-section">${detailHeading(`${t('threads')} (${threadTables.length})`,copies,threadTables.map(rows=>detailTsv(rows)).join('\n\n'))}${threadTables.map(rows=>detailRows(rows)).join('')}</section>`:''}`;
      state.detailCopies = copies;
    }

    function centerGraphNode(id, behavior = 'smooth') {
      if (!id) return;
      const card = $(`.node-card[data-id="${CSS.escape(id)}"]`, els.graph);
      if (!card) return;
      updateGraphViewport();
      const visibleWidth = Math.max(1, els.canvasWrap.clientWidth - graphDetailsInset());
      const left = (card.offsetLeft + card.offsetWidth / 2) * state.zoom - visibleWidth / 2;
      const top = (card.offsetTop + card.offsetHeight / 2) * state.zoom - els.canvasWrap.clientHeight / 2;
      const maxLeft = Math.max(0, els.graphStage.scrollWidth - els.canvasWrap.clientWidth);
      const maxTop = Math.max(0, els.graphStage.scrollHeight - els.canvasWrap.clientHeight);
      els.canvasWrap.scrollTo({left:Math.max(0,Math.min(maxLeft,left)),top:Math.max(0,Math.min(maxTop,top)),behavior});
    }

    function centerTreeNode(id, behavior = 'smooth') {
      if (!id) return;
      const row = $(`.tree-row[data-id="${CSS.escape(id)}"]`, els.tree);
      const node = currentNodes().find(candidate => candidate.id === id);
      if (!row || !node) return;
      const top = row.offsetTop + row.offsetHeight / 2 - els.tree.clientHeight / 2;
      const left = node.depth * 15 - 25;
      els.tree.scrollTo({
        top:Math.max(0,Math.min(els.tree.scrollHeight-els.tree.clientHeight,top)),
        left:Math.max(0,Math.min(els.tree.scrollWidth-els.tree.clientWidth,left)),
        behavior
      });
    }

    function selectNode(id, { centerGraph = false, centerTree = false, toggle = true } = {}) {
      const nextId = id && (!toggle || state.selectedId !== id) ? id : null;
      const nextNode = nextId ? currentNodes().find(node => node.id === nextId) : null;
      if (centerTree && nextNode) {
        let parent = nextNode.parent;
        while (parent) { state.collapsedIds.delete(parent.id); parent = parent.parent; }
      }
      state.selectedId = nextId;
      renderTree(); renderGraph();
      const node=selectedNode();
      if(node) {
        renderDetails(node);
        if(!state.detailsLocked) els.detailsDrawer.classList.add('open');
        updateGraphViewport();
        if(centerGraph) requestAnimationFrame(() => centerGraphNode(node.id));
        if(centerTree) requestAnimationFrame(() => centerTreeNode(node.id));
      } else {
        els.detailsDrawer.classList.remove('open');
        updateGraphViewport();
      }
    }

    function renderHistoryLists() {
      if (!els.historyList || !els.homeHistoryList) return;
      const html = state.history.length ? state.history.map(item => {
        const date = new Date(item.openedAt).toLocaleString(locale === 'ru' ? 'ru-RU' : 'en-GB');
        return `<div class="history-item" data-id="${esc(item.id)}"><div><div class="history-name">${esc(item.name)}</div><div class="history-meta">${esc(t('historyMeta',{date,statements:item.statements||'?',nodes:item.nodeCount??'?'}))}</div></div><button class="history-delete" data-delete="${esc(item.id)}" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}">×</button></div>`;
      }).join('') : `<div style="padding:22px;color:var(--muted);text-align:center">${esc(t('emptyHistory'))}</div>`;
      els.historyList.innerHTML = html;
      els.homeHistoryList.innerHTML = html;
      els.historyCount.textContent = state.history.length ? `(${state.history.length})` : '';
    }

    async function refreshHistory() {
      state.history = await historyStore.list();
      renderHistoryLists();
    }

    function openHistory(open) {
      els.historyPanel.classList.toggle('open',open);
      els.overlay.classList.toggle('open',open);
      if(open) refreshHistory();
    }

    function showHome() {
      state.screen = 'home';
      els.viewer.classList.remove('visible');
      els.emptyState.classList.remove('hidden');
      els.planSidebar.classList.add('hidden');
      els.homeSidebar.classList.remove('hidden');
      els.menuBtn.classList.add('hidden');
      els.historyBtn.classList.add('hidden');
      els.detailsDrawer.classList.remove('open');
      els.detailsHandle.classList.remove('visible');
      openHistory(false);
      els.pasteBox.value='';
      els.planNameInput.value='';
      refreshHistory();
    }

    function toast(message,error=false) {
      els.toast.textContent=message; els.toast.classList.toggle('error',error); els.toast.classList.add('show');
      clearTimeout(toast.timer); toast.timer=setTimeout(()=>els.toast.classList.remove('show'),2600);
    }

    function openTextModal(titleKey, value) {
      els.textModalTitle.textContent = t(titleKey);
      els.queryText.textContent = value || t('queryUnavailable');
      els.queryText.scrollTop = 0;
      els.queryText.scrollLeft = 0;
      els.queryModal.classList.add('open');
    }

    async function copyText(value) {
      try {
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try { await navigator.clipboard.writeText(value); copied = true; }
          catch { copied = false; }
        }
        if (!copied) {
          const area = document.createElement('textarea');
          area.value = value;
          area.setAttribute('readonly', '');
          area.style.cssText = 'position:fixed;left:-10000px;top:0;opacity:0';
          document.body.appendChild(area);
          area.select();
          copied = document.execCommand('copy');
          area.remove();
          if (!copied) throw new Error('copy command failed');
        }
        toast(t('copied'));
      } catch {
        toast(t('copyFailed'), true);
      }
    }

    function copyModalText() {
      return copyText(els.queryText.textContent);
    }

    async function readFile(file) {
      if(!file) return;
      if(file.size > 30*1024*1024) { toast(t('fileTooLarge'),true); return; }
      const displayName = els.planNameInput.value.trim() || file.name;
      try { await loadXml(await file.text(),displayName,true); }
      catch(err) { toast(err.message || t('openFailed'),true); }
    }

    function setDetailsLocked(locked) {
      state.detailsLocked = locked;
      els.hideDetailsCheck.checked = locked;
      els.detailsHandle.classList.toggle('visible', locked && state.screen === 'viewer');
      if (locked) els.detailsDrawer.classList.remove('open');
      updateGraphViewport();
    }

    function updateZoom() {
      els.graph.style.transform = Math.abs(state.zoom - 1) < .001 ? '' : `scale(${state.zoom})`;
      els.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
      updateGraphViewport();
    }

    async function historyClick(e) {
      const del=e.target.closest('[data-delete]');
      if(del){e.stopPropagation();await historyStore.remove(del.dataset.delete);await refreshHistory();return;}
      const item=e.target.closest('.history-item');
      if(!item)return;
      const saved=state.history.find(x=>x.id===item.dataset.id);
      if(saved){try{await loadXml(saved.xml,saved.name,false);openHistory(false);}catch(err){toast(err.message,true);}}
    }

    async function clearHistory() {
      if(!state.history.length || !confirm(t('clearConfirm'))) return;
      await historyStore.clear();
      await refreshHistory();
      toast(t('historyCleared'));
    }

    els.chooseBtn.onclick = () => els.fileInput.click();
    els.menuBtn.onclick = showHome;
    els.fileInput.onchange = () => { readFile(els.fileInput.files[0]); els.fileInput.value=''; };
    els.parsePasteBtn.onclick = async () => { const xml=els.pasteBox.value.trim(); if(!xml)return toast(t('pasteFirst'),true); const name=els.planNameInput.value.trim()||`${t('pastedPlan')}.sqlplan`; try{await loadXml(xml,name,true);}catch(err){toast(err.message,true);} };
    ['dragenter','dragover'].forEach(type => document.addEventListener(type,e=>{e.preventDefault();els.dropCard.classList.add('drag');}));
    ['dragleave','drop'].forEach(type => document.addEventListener(type,e=>{e.preventDefault();els.dropCard.classList.remove('drag');}));
    document.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
    els.statementTabs.addEventListener('click',e=>{ const b=e.target.closest('[data-index]'); if(!b)return; state.statementIndex=Number(b.dataset.index); const s=currentStatement(); state.selectedId=null; state.collapsedIds.clear(); els.detailsDrawer.classList.remove('open'); renderAll(); const rootId=s.roots[0]?.id; if(rootId)requestAnimationFrame(()=>centerGraphNode(rootId,'auto')); });
    els.metricSwitch.addEventListener('click',e=>{ const b=e.target.closest('[data-metric]'); if(!b)return; state.metric=b.dataset.metric; renderTree(); });
    els.expandAllBtn.onclick=()=>{if(!state.collapsedIds.size)return;state.collapsedIds.clear();renderTree();};
    els.tree.addEventListener('click',e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){e.preventDefault();e.stopPropagation();state.dragMoved=false;const id=toggle.dataset.toggle;if(state.collapsedIds.has(id))state.collapsedIds.delete(id);else state.collapsedIds.add(id);renderTree();return;}if(state.dragMoved){state.dragMoved=false;return;}const row=e.target.closest('[data-id]');if(row)selectNode(row.dataset.id,{centerGraph:true});});
    els.canvasWrap.addEventListener('click',e=>{if(state.dragMoved){state.dragMoved=false;return;}const card=e.target.closest('.node-card[data-id]');selectNode(card?.dataset.id||null,{centerTree:Boolean(card)});});
    els.drawerBody.addEventListener('click',e=>{const button=e.target.closest('[data-copy-detail]');if(!button)return;e.preventDefault();e.stopPropagation();const key=button.dataset.copyDetail;if(state.detailCopies.has(key))copyText(state.detailCopies.get(key));});
    els.closeDetails.onclick=()=>{els.detailsDrawer.classList.remove('open');updateGraphViewport();};
    els.hideDetailsCheck.onchange=()=>setDetailsLocked(els.hideDetailsCheck.checked);
    els.detailsHandle.onclick=()=>{setDetailsLocked(false);const n=selectedNode();if(n){renderDetails(n);els.detailsDrawer.classList.add('open');updateGraphViewport();}};
    els.fitBtn.onclick=()=>{state.zoom=1;updateZoom();const rootId=currentStatement()?.roots[0]?.id;if(rootId)requestAnimationFrame(()=>centerGraphNode(rootId));else els.canvasWrap.scrollTo({left:0,top:0,behavior:'smooth'});};
    els.queryBtn.onclick=()=>{if(els.queryBtn.disabled)return;const s=currentStatement();openTextModal('queryText',s?.batchText||s?.text);};
    els.rawPlanBtn.onclick=()=>openTextModal('rawPlan',state.currentXml);
    els.copyTextBtn.onclick=copyModalText;
    els.closeQuery.onclick=()=>els.queryModal.classList.remove('open');
    els.queryModal.addEventListener('click',e=>{if(e.target===els.queryModal)els.queryModal.classList.remove('open');});
    els.historyBtn.onclick=()=>openHistory(true); els.closeHistory.onclick=els.overlay.onclick=()=>openHistory(false);
    els.historyList.addEventListener('click',historyClick);
    els.homeHistoryList.addEventListener('click',historyClick);
    els.clearHistoryBtn.onclick=els.homeClearHistoryBtn.onclick=clearHistory;
    els.languageSelect.onchange=()=>{locale=els.languageSelect.value;localStorage.setItem('sql-plan-language',locale);applyI18n();};
    window.addEventListener('keydown',e=>{if(e.key==='Escape'){els.queryModal.classList.remove('open');els.detailsDrawer.classList.remove('open');updateGraphViewport();openHistory(false);}});

    let graphPan = null, graphPanFrame = 0;
    const applyGraphPan = () => {
      graphPanFrame = 0;
      if (!graphPan?.captured) return;
      els.canvasWrap.scrollLeft = graphPan.left - (graphPan.latestX - graphPan.x);
      els.canvasWrap.scrollTop = graphPan.top - (graphPan.latestY - graphPan.y);
    };
    els.canvasWrap.addEventListener('pointerdown',e=>{if(e.button!==0)return;graphPan={pointerId:e.pointerId,x:e.clientX,y:e.clientY,latestX:e.clientX,latestY:e.clientY,left:els.canvasWrap.scrollLeft,top:els.canvasWrap.scrollTop,captured:false};state.dragMoved=false;});
    els.canvasWrap.addEventListener('pointermove',e=>{if(!graphPan)return;graphPan.latestX=e.clientX;graphPan.latestY=e.clientY;const dx=e.clientX-graphPan.x,dy=e.clientY-graphPan.y;if(!graphPan.captured&&Math.abs(dx)+Math.abs(dy)<=6)return;if(!graphPan.captured){graphPan.captured=true;els.canvasWrap.setPointerCapture(graphPan.pointerId);els.canvasWrap.classList.add('panning');}state.dragMoved=true;if(!graphPanFrame)graphPanFrame=requestAnimationFrame(applyGraphPan);});
    const endGraphPan=()=>{if(graphPanFrame){cancelAnimationFrame(graphPanFrame);graphPanFrame=0;applyGraphPan();}graphPan=null;els.canvasWrap.classList.remove('panning');};
    els.canvasWrap.addEventListener('pointerup',endGraphPan);els.canvasWrap.addEventListener('pointercancel',endGraphPan);
    els.canvasWrap.addEventListener('wheel',e=>{e.preventDefault();const scale=e.deltaMode===1?33:e.deltaMode===2?300:1;const deltaX=e.deltaX*scale,deltaY=e.deltaY*scale;if(!e.ctrlKey){els.canvasWrap.scrollBy({left:deltaX,top:deltaY});return;}const old=state.zoom;const factor=Math.exp(-deltaY*.0015);const next=Math.max(.35,Math.min(2.5,old*factor));if(Math.abs(next-old)<.001)return;const rect=els.canvasWrap.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;const contentX=(els.canvasWrap.scrollLeft+px)/old,contentY=(els.canvasWrap.scrollTop+py)/old;state.zoom=next;updateZoom();requestAnimationFrame(()=>{els.canvasWrap.scrollLeft=contentX*next-px;els.canvasWrap.scrollTop=contentY*next-py;});},{passive:false});

    let treePan = null;
    els.tree.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-toggle]'))return;treePan={pointerId:e.pointerId,x:e.clientX,y:e.clientY,left:els.tree.scrollLeft,dragging:false};els.tree.setPointerCapture(e.pointerId);state.dragMoved=false;});
    els.tree.addEventListener('pointermove',e=>{if(!treePan)return;const dx=e.clientX-treePan.x,dy=e.clientY-treePan.y;if(Math.abs(dx)+Math.abs(dy)>6)state.dragMoved=true;if(!treePan.dragging&&Math.abs(dx)<=6)return;if(!treePan.dragging){treePan.dragging=true;els.tree.classList.add('panning');}e.preventDefault();els.tree.scrollLeft=treePan.left-dx;});
    const endTreePan=()=>{treePan=null;els.tree.classList.remove('panning');};
    els.tree.addEventListener('pointerup',endTreePan);els.tree.addEventListener('pointercancel',endTreePan);

    let resizing=false;
    els.resizer.addEventListener('pointerdown',e=>{resizing=true;els.resizer.setPointerCapture(e.pointerId);els.resizer.classList.add('dragging');});
    els.resizer.addEventListener('pointermove',e=>{if(!resizing)return;const width=Math.max(270,Math.min(window.innerWidth*.65,e.clientX));document.documentElement.style.setProperty('--left-width',width+'px');});
    els.resizer.addEventListener('pointerup',()=>{resizing=false;els.resizer.classList.remove('dragging');});

    if ('ResizeObserver' in window) new ResizeObserver(updateGraphViewport).observe(els.canvasWrap);
    else window.addEventListener('resize', updateGraphViewport);

    applyI18n();
    refreshHistory().catch(()=>{});
  })();
  </script>
</body>
</html>
