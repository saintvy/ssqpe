<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SQL Server Plan Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --surface: #181d27;
      --surface-2: #202735;
      --surface-3: #293244;
      --border: #333e52;
      --muted: #94a0b5;
      --text: #edf1f7;
      --accent: #55b6ff;
      --accent-2: #8b7dff;
      --time: #42c89c;
      --cost: #e9aa57;
      --danger: #ff6d7a;
      --warning: #f4cb62;
      --left-width: 410px;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { color: var(--text); }
    .app { height: 100%; display: grid; grid-template-rows: 54px minmax(0, 1fr); }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); background: #141923; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: .1px; white-space: nowrap; }
    .logo { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; color: #08131b; background: linear-gradient(135deg, var(--accent), #5fe0bd); font-size: 14px; font-weight: 900; }
    .top-actions { display: flex; gap: 8px; margin-left: auto; }
    .language-select { color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; cursor: pointer; }
    .btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 7px 11px; cursor: pointer; transition: .15s; white-space: nowrap; }
    .btn:hover { border-color: #526079; background: var(--surface-3); }
    .btn.primary { color: #07131c; border-color: transparent; background: var(--accent); font-weight: 700; }
    .btn.danger { color: #ffb6bc; }
    .file-input { display: none; }
    .workspace { display: grid; grid-template-columns: var(--left-width) 6px minmax(0, 1fr); min-height: 0; }
    .sidebar { min-width: 0; background: var(--surface); overflow: hidden; }
    .plan-sidebar { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    .home-sidebar { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr); }
    .home-sidebar-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
    .home-sidebar-head h2 { margin: 0; flex: 1; font-size: 15px; }
    .resizer { cursor: col-resize; background: transparent; border-left: 1px solid var(--border); border-right: 1px solid transparent; }
    .resizer:hover, .resizer.dragging { background: #263650; border-color: var(--accent); }
    .plan-head { padding: 13px 14px 11px; border-bottom: 1px solid var(--border); }
    .plan-title { font-size: 14px; font-weight: 720; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-meta { color: var(--muted); margin-top: 3px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .statement-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
    .statement-tab { border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .statement-tab.active { color: var(--text); border-color: var(--accent); background: #1b3145; }
    .tree-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
    .metric-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .metric-switch .label { color: var(--muted); margin-right: auto; }
    .metric-notice { flex: 0 0 100%; color: var(--warning); font-size: 11px; min-height: 0; }
    .metric-notice:empty { display: none; }
    .rows-legend { display: flex; flex-wrap: wrap; gap: 9px; color: var(--muted); }
    .metric-dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; }
    .segmented { display: inline-flex; padding: 2px; gap: 2px; background: #10151e; border: 1px solid var(--border); border-radius: 7px; }
    .segmented button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 5px; }
    .segmented button.active { color: var(--text); background: var(--surface-3); }
    .tree { overflow: auto; padding: 7px 0 24px; cursor: default; user-select: none; }
    .tree.ctrl-panning { cursor: grabbing; }
    .tree-row { position: relative; width: 100%; height: 39px; display: flex; align-items: center; gap: 7px; padding: 0 9px; cursor: pointer; border-left: 2px solid transparent; }
    .tree-row:hover { background: #202735; }
    .tree-row.selected { background: #233148; border-left-color: var(--accent); }
    .tree-name { min-width: 0; flex: 1 1 auto; overflow: hidden; }
    .tree-op { display: block; padding-left: min(calc(var(--depth) * 15px), 105px); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-object { display: block; padding-left: min(calc(var(--depth) * 15px), 105px); color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-bar { flex: 0 0 118px; width: 118px; height: 18px; position: relative; overflow: hidden; border-radius: 4px; background: #10151e; box-shadow: inset 0 0 0 1px #2b3546; }
    .tree-bar .subtree, .tree-bar .self { position: absolute; left: 0; top: 0; bottom: 0; min-width: 0; }
    .tree-bar .subtree { opacity: .27; }
    .tree-bar .self { opacity: .92; }
    .tree-bar .estimate, .tree-bar .actual { position: absolute; left: 0; top: 0; bottom: 0; }
    .tree-bar .estimate { background: #7d8798; opacity: .35; }
    .tree-bar .actual.under { background: #ff6574; }
    .tree-bar .actual.over { background: #5c9fff; }
    .tree-bar .actual.close { background: #4fd0a4; }
    .tree-value { flex: 0 0 72px; width: 72px; text-align: right; color: #c4cbd8; font-variant-numeric: tabular-nums; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .call-mark { color: var(--accent-2); margin-right: 4px; }
    .main { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: radial-gradient(circle at 10% 0%, #192233 0, transparent 38%), var(--bg); }
    .empty { height: 100%; display: grid; place-items: center; padding: 30px; }
    .drop-card { width: min(670px, 92%); border: 1px dashed #52617a; border-radius: 15px; padding: 42px; text-align: center; background: rgba(24,29,39,.86); }
    .drop-card.drag { border-color: var(--accent); background: #1c2a3a; }
    .drop-icon { margin: 0 auto 16px; width: 58px; height: 58px; display: grid; place-items: center; border-radius: 16px; background: #20344a; color: var(--accent); font-size: 28px; }
    .drop-card h1 { margin: 0 0 8px; font-size: 22px; }
    .drop-card p { margin: 0 auto 18px; color: var(--muted); max-width: 500px; }
    .paste-box { width: 100%; height: 104px; resize: vertical; color: var(--text); background: #0f141d; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 18px; outline: none; }
    .paste-box:focus { border-color: var(--accent); }
    .plan-name-field { width: 100%; color: var(--text); background: #0f141d; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin: 0 0 12px; outline: none; }
    .plan-name-field:focus { border-color: var(--accent); }
    .viewer { height: 100%; display: none; grid-template-rows: auto minmax(0, 1fr); }
    .viewer.visible { display: grid; }
    .viewer-toolbar { min-height: 45px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); background: rgba(20,25,35,.93); }
    .viewer-toolbar .spacer { flex: 1; }
    .query-button { max-width: min(48vw, 560px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .canvas-wrap { overflow: auto; position: relative; cursor: grab; user-select: none; overscroll-behavior: contain; }
    .canvas-wrap.panning { cursor: grabbing; }
    .graph { position: relative; min-width: 100%; min-height: 100%; transform-origin: 0 0; }
    .edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: #53627b; stroke-width: 1.5; }
    .edge.call { stroke: var(--accent-2); stroke-dasharray: 5 5; stroke-width: 1.8; }
    .edge-arrow { fill: var(--accent-2); }
    .node-card { position: absolute; width: 220px; min-height: 106px; border: 1px solid #3a465b; border-radius: var(--radius); background: #1b212c; box-shadow: 0 4px 13px rgba(0,0,0,.24); cursor: pointer; overflow: visible; transition: border-color .13s, box-shadow .13s; }
    .node-card:hover { border-color: #63738d; }
    .node-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(85,182,255,.14), 0 5px 17px rgba(0,0,0,.3); z-index: 5; }
    .node-card.warning { border-top-color: var(--warning); }
    .node-card.call-node { border-color: #655db0; background: #201f35; }
    .node-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 9px 10px 5px; }
    .node-title { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-id { color: var(--muted); font-size: 11px; }
    .node-subtitle { padding: 0 10px 7px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
    .node-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #30394a; }
    .stat { padding: 6px 8px; min-width: 0; }
    .stat + .stat { border-left: 1px solid #30394a; }
    .stat-label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .45px; }
    .stat-value { margin-top: 1px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .node-expanded { display: none; padding: 8px 10px 10px; border-top: 1px solid #30394a; color: #cbd3e1; }
    .node-card.expanded { width: 278px; z-index: 8; }
    .node-card.expanded .node-expanded { display: block; }
    .expanded-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
    .expanded-item b { display: block; color: var(--muted); font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .expanded-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-flags { display: flex; gap: 4px; position: absolute; right: 7px; top: 31px; }
    .flag { position: relative; display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 4px; background: #30394a; color: #d4dbea; font-size: 9px; font-weight: 800; }
    .flag::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 6px); width: max-content; max-width: 220px; padding: 5px 7px; border: 1px solid #516079; border-radius: 5px; background: #111722; color: var(--text); font-size: 11px; font-weight: 500; line-height: 1.3; white-space: normal; opacity: 0; transform: translateY(3px); pointer-events: none; transition: .12s; box-shadow: 0 5px 14px rgba(0,0,0,.35); z-index: 20; }
    .flag:hover::after, .flag:focus-visible::after { opacity: 1; transform: translateY(0); }
    .flag.warn { background: #5d4b1e; color: var(--warning); }
    .flag.parallel { background: #243f62; color: #8bc8ff; }
    .flag.batch { background: #244b42; color: #72dbbd; }
    .subplan-zone { position: absolute; border: 1px dashed #5c557f; background: rgba(43,39,70,.22); border-radius: 13px; }
    .subplan-label { position: absolute; left: 12px; top: 9px; color: #b7aefa; font-weight: 700; }
    .details-drawer { position: absolute; top: 45px; right: 0; bottom: 0; width: min(430px, 88%); z-index: 30; transform: translateX(102%); transition: transform .18s ease; background: #171c26; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.28); display: grid; grid-template-rows: auto minmax(0,1fr); }
    .details-drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-bottom: 1px solid var(--border); }
    .drawer-head-text { min-width: 0; flex: 1; }
    .drawer-lock { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; cursor: pointer; }
    .drawer-title { font-size: 16px; font-weight: 750; }
    .drawer-subtitle { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 7px; font-size: 18px; }
    .drawer-body { overflow: auto; padding: 12px 14px 30px; }
    .details-handle { display: none; position: absolute; right: 0; top: 105px; z-index: 31; border: 1px solid var(--accent); border-right: 0; border-radius: 7px 0 0 7px; background: #20334a; color: #bfe4ff; padding: 11px 6px; cursor: pointer; writing-mode: vertical-rl; }
    .details-handle.visible { display: block; }
    .detail-section { margin-bottom: 16px; }
    .detail-section h3 { margin: 0 0 7px; color: #c8d1df; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
    .kv { display: grid; grid-template-columns: minmax(120px, 44%) minmax(0, 1fr); border-top: 1px solid #2b3444; }
    .kv > div { padding: 5px 2px; overflow-wrap: anywhere; }
    .kv .k { color: var(--muted); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { padding: 4px 7px; border-radius: 5px; background: #252d3c; border: 1px solid #343f52; overflow-wrap: anywhere; }
    .expression { white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px; border-radius: 6px; background: #0f141c; border: 1px solid #2d3646; color: #d5dbe7; }
    .history-panel { position: fixed; top: 54px; right: 0; bottom: 0; z-index: 70; width: min(420px, 92vw); transform: translateX(102%); transition: .2s; background: #171c26; border-left: 1px solid var(--border); box-shadow: -12px 0 35px rgba(0,0,0,.4); display: grid; grid-template-rows: auto minmax(0,1fr); }
    .history-panel.open { transform: translateX(0); }
    .history-head { display: flex; align-items: center; gap: 8px; padding: 14px; border-bottom: 1px solid var(--border); }
    .history-head h2 { margin: 0; font-size: 16px; flex: 1; }
    .history-list { overflow: auto; padding: 8px; }
    .history-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 10px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
    .history-item:hover { background: var(--surface-2); border-color: var(--border); }
    .history-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .history-delete { align-self: center; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; }
    .history-delete:hover { color: var(--danger); }
    .overlay { display: none; position: fixed; inset: 54px 0 0; z-index: 60; background: rgba(0,0,0,.38); }
    .overlay.open { display: block; }
    .modal { display: none; position: fixed; z-index: 90; inset: 0; place-items: center; background: rgba(4,7,11,.7); padding: 20px; }
    .modal.open { display: grid; }
    .modal-card { width: min(760px, 96vw); max-height: 82vh; display: grid; grid-template-rows: auto minmax(0,1fr); background: #181e28; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.5); overflow: hidden; }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 15px; flex: 1; }
    .query-text { margin: 0; padding: 15px; overflow: auto; white-space: pre-wrap; color: #d9e2ef; background: #11161f; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 100; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 9px 13px; border-radius: 7px; background: #273246; border: 1px solid #44516a; box-shadow: 0 6px 20px rgba(0,0,0,.35); transition: .18s; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    .toast.error { border-color: #8d3d48; color: #ffb9c0; }
    .zoom-label { min-width: 45px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    @media (max-width: 850px) {
      :root { --left-width: 310px; }
      .brand span:last-child { display: none; }
      .tree-bar { flex-basis: 88px; width: 88px; }
      .tree-value { flex-basis: 58px; width: 58px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">QP</span><span>SQL Server Plan Explorer</span></div>
      <div class="top-actions">
        <button class="btn hidden" id="menuBtn" data-i18n="backToMenu"></button>
        <button class="btn hidden" id="historyBtn"><span data-i18n="history"></span> <span id="historyCount"></span></button>
        <select class="language-select" id="languageSelect" data-i18n-title="language"></select>
        <input class="file-input" id="fileInput" type="file" accept=".sqlplan,.xml,.sqplan,text/xml,application/xml">
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="home-sidebar" id="homeSidebar">
          <div class="home-sidebar-head"><h2 data-i18n="savedPlans"></h2><button class="btn danger" id="homeClearHistoryBtn" data-i18n="clear"></button></div>
          <div class="history-list" id="homeHistoryList"></div>
        </div>
        <div class="plan-sidebar hidden" id="planSidebar">
          <div class="plan-head">
            <div class="plan-title" id="planTitle"></div>
            <div class="plan-meta" id="planMeta"></div>
          </div>
          <div class="statement-tabs" id="statementTabs"></div>
          <div class="tree-panel">
            <div class="metric-switch">
              <span class="label" data-i18n="metric"></span>
              <div class="segmented" id="metricSwitch">
                <button data-metric="time" class="active" data-i18n="time"></button>
                <button data-metric="cost" data-i18n="cost"></button>
                <button data-metric="rows" data-i18n="rows"></button>
              </div>
              <div class="metric-notice" id="metricNotice"></div>
            </div>
            <div class="tree" id="tree"></div>
          </div>
        </div>
      </aside>
      <div class="resizer" id="resizer" data-i18n-title="resizeSidebar"></div>
      <main class="main" id="main">
        <section class="empty" id="emptyState">
          <div class="drop-card" id="dropCard">
            <div class="drop-icon">⇩</div>
            <h1 data-i18n="openExecutionPlan"></h1>
            <p data-i18n-html="dropDescription"></p>
            <input class="plan-name-field" id="planNameInput" data-i18n-placeholder="planNamePlaceholder">
            <button class="btn primary" id="chooseBtn" data-i18n="chooseFile"></button>
            <textarea class="paste-box" id="pasteBox" spellcheck="false" data-i18n-placeholder="pastePlaceholder"></textarea>
            <button class="btn" id="parsePasteBtn" data-i18n="parseXml"></button>
          </div>
        </section>

        <section class="viewer" id="viewer">
          <div class="viewer-toolbar">
            <button class="btn query-button" id="queryBtn"></button>
            <span class="spacer"></span>
            <span class="zoom-label" id="zoomLabel">100%</span>
            <button class="btn" id="fitBtn" data-i18n="resetView"></button>
            <button class="btn" id="detailsBtn" data-i18n="details"></button>
          </div>
          <div class="canvas-wrap" id="canvasWrap"><div class="graph" id="graph"></div></div>
          <aside class="details-drawer" id="detailsDrawer">
            <div class="drawer-head"><div class="drawer-head-text"><div class="drawer-title" id="drawerTitle"></div><div class="drawer-subtitle" id="drawerSubtitle"></div></div><label class="drawer-lock"><input type="checkbox" id="hideDetailsCheck"><span data-i18n="keepDetailsHidden"></span></label><button class="icon-btn" id="closeDetails" data-i18n-aria="close">×</button></div>
            <div class="drawer-body" id="drawerBody"></div>
          </aside>
          <button class="details-handle" id="detailsHandle" data-i18n="showDetails"></button>
        </section>
      </main>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="history-panel" id="historyPanel">
    <div class="history-head"><h2 data-i18n="savedPlans"></h2><button class="btn danger" id="clearHistoryBtn" data-i18n="clear"></button><button class="icon-btn" id="closeHistory" data-i18n-aria="close">×</button></div>
    <div class="history-list" id="historyList"></div>
  </aside>
  <div class="modal" id="queryModal"><div class="modal-card"><div class="modal-head"><h2 data-i18n="queryText"></h2><button class="icon-btn" id="closeQuery" data-i18n-aria="close">×</button></div><pre class="query-text" id="queryText"></pre></div></div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {
    'use strict';

    const I18N = {
      ru: {
        languageName: '🇷🇺 Русский', backToMenu: 'Возврат в меню', history: 'История', language: 'Язык интерфейса', savedPlans: 'Сохранённые планы', clear: 'Очистить',
        metric: 'Показатель', time: 'Время', cost: 'Стоимость', rows: 'Строки', resizeSidebar: 'Изменить ширину панели',
        openExecutionPlan: 'Откройте план выполнения SQL Server', dropDescription: 'Перетащите сюда файл <b>.sqlplan</b> из SSMS, выберите его с диска или вставьте ShowPlan XML. Данные не покидают браузер.',

    };

    let locale = localStorage.getItem('sql-plan-language') || (navigator.language?.toLowerCase().startsWith('ru') ? 'ru' : 'en');
    if (!I18N[locale]) locale = 'en';
    const t = (key, values = {}) => {
      let text = I18N[locale][key] ?? I18N.en[key] ?? key;
      Object.entries(values).forEach(([name, value]) => text = text.replaceAll(`{${name}}`, value));
      return text;
    };

    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
    const els = Object.fromEntries([
      'fileInput','menuBtn','historyBtn','historyCount','languageSelect','chooseBtn','planNameInput','pasteBox','parsePasteBtn','dropCard','emptyState','viewer','homeSidebar','homeHistoryList','homeClearHistoryBtn','planSidebar','planTitle','planMeta','statementTabs','metricSwitch','metricNotice','tree','main','canvasWrap','graph','queryBtn','fitBtn','zoomLabel','detailsBtn','detailsDrawer','detailsHandle','hideDetailsCheck','drawerTitle','drawerSubtitle','drawerBody','closeDetails','historyPanel','historyList','clearHistoryBtn','closeHistory','overlay','queryModal','queryText','closeQuery','toast','resizer'
    ].map(id => [id, document.getElementById(id)]));

    const state = {
      plan: null,
      statementIndex: 0,
      selectedId: null,
      metric: 'time',
      currentFile: '',
      currentXml: '',
      history: [],
      layout: null,
      screen: 'home',
      zoom: 1,
      detailsLocked: false,
      dragMoved: false
    };

    function applyI18n() {
      document.documentElement.lang = locale;
      $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
      $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
      $$('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
      $$('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
      $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
      els.languageSelect.innerHTML = Object.keys(I18N).map(code => `<option value="${code}">${esc(I18N[code].languageName)}</option>`).join('');
      els.languageSelect.value = locale;
      if (state.plan) renderAll();
      renderHistoryLists();
    }

    const lname = el => el && (el.localName || el.nodeName.split(':').pop());
    const all = (root, name) => Array.from(root.getElementsByTagNameNS('*', name));
    const children = (root, name) => Array.from(root.children || []).filter(el => !name || lname(el) === name);
    const first = (root, name) => all(root, name)[0] || null;
    const attr = (el, name, fallback = '') => el && el.hasAttribute(name) ? el.getAttribute(name) : fallback;
    const num = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const bool = value => value === '1' || String(value).toLowerCase() === 'true';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const shortText = (s, n = 90) => (s || '').replace(/\s+/g, ' ').trim().slice(0, n);
    const formatNumber = value => {
      if (value === null || value === undefined || value === '') return '—';
      const n = Number(value);
      if (!Number.isFinite(n)) return String(value);
      if (n === 0) return '0';
      if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(2).replace(/\.00$/, '') + 'K';
      if (Math.abs(n) < .001) return n.toExponential(2);
      return n.toLocaleString(locale === 'ru' ? 'ru-RU' : 'en-GB', { maximumFractionDigits: 3 });
    };
    const formatMs = value => {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
      const n = Number(value);
      if (n >= 60000) return (n / 60000).toFixed(2) + ' ' + t('minute');
      if (n >= 1000) return (n / 1000).toFixed(2) + ' ' + t('second');
      return formatNumber(n) + ' ' + t('millisecond');
    };
    const formatBytes = kb => {
      const n = Number(kb);
      if (!Number.isFinite(n)) return '—';
      if (n >= 1048576) return (n / 1048576).toFixed(2) + ' ' + t('gigabyte');
      if (n >= 1024) return (n / 1024).toFixed(2) + ' ' + t('megabyte');
      return formatNumber(n) + ' ' + t('kilobyte');
    };

    function directWithin(relop, tag) {
      return all(relop, tag).filter(el => {
        let p = el.parentElement;
        while (p && p !== relop && lname(p) !== 'RelOp') p = p.parentElement;
        return p === relop;
      });
    }

    function directChildRelOps(relop) {
      return all(relop, 'RelOp').filter(candidate => {
        let p = candidate.parentElement;
        while (p && lname(p) !== 'RelOp') p = p.parentElement;
        return p === relop;
      });
    }

    function nearestAncestor(el, name) {
      let p = el && el.parentElement;
      while (p && lname(p) !== name) p = p.parentElement;
      return p;
    }

    function nearestStatement(el) {
      let p = el && el.parentElement;
      while (p && !lname(p).startsWith('Stmt')) p = p.parentElement;
      return p;
    }

    function formatColumn(el) {
      const parts = [attr(el,'Database'), attr(el,'Schema'), attr(el,'Alias') || attr(el,'Table'), attr(el,'Column')].filter(Boolean);
      return parts.join('.').replace(/\]\./g, '].');
    }

    function objectLabel(relop) {
      const object = directWithin(relop, 'Object')[0];
      if (!object) return '';
      return ['Database','Schema','Table','Index'].map(k => attr(object, k)).filter(Boolean).join('.');
    }

    function runtimeAggregate(relop) {
      const counters = directWithin(relop, 'RunTimeCountersPerThread');
      if (!counters.length) return null;
      const sumKeys = ['ActualRows','ActualRowsRead','ActualCPUms','ActualLogicalReads','ActualPhysicalReads','ActualReadAheads','ActualLobLogicalReads','ActualLobPhysicalReads','ActualLobReadAheads','ActualScans','ActualRebinds','ActualRewinds','ActualExecutions','Batches','ActualEndOfScans'];
      const result = {
        threads: counters.length,
        threadRows: [],
        hasElapsed: counters.some(el => el.hasAttribute('ActualElapsedms')),
        hasCPU: counters.some(el => el.hasAttribute('ActualCPUms')),
        hasRows: counters.some(el => el.hasAttribute('ActualRows'))
      };
      sumKeys.forEach(k => result[k] = counters.reduce((sum, el) => sum + num(attr(el, k)), 0));
      result.ActualElapsedms = counters.reduce((max, el) => Math.max(max, num(attr(el, 'ActualElapsedms'))), 0);
      result.ActualExecutionsMax = counters.reduce((max, el) => Math.max(max, num(attr(el, 'ActualExecutions'))), 0);
      result.ActualExecutionMode = counters.map(el => attr(el, 'ActualExecutionMode')).find(Boolean) || '';
      result.threadRows = counters.map(el => ({
        Thread: attr(el, 'Thread'), ActualRows: attr(el, 'ActualRows'), ActualElapsedms: attr(el, 'ActualElapsedms'), ActualCPUms: attr(el, 'ActualCPUms'), ActualExecutions: attr(el, 'ActualExecutions'), ActualLogicalReads: attr(el, 'ActualLogicalReads')
      }));
      return result;
    }

    function extractExpressions(relop) {
      const values = [];
      directWithin(relop, 'ScalarOperator').forEach(el => {
        const text = attr(el, 'ScalarString');
        if (text && !values.includes(text)) values.push(text);
      });
      return values;
    }

    function extractWarnings(relop) {
      const warnings = [];
      directWithin(relop, 'Warnings').forEach(w => {
        if (w.attributes.length) warnings.push(Array.from(w.attributes).map(a => `${a.name}: ${a.value}`).join(', '));
        Array.from(w.children).forEach(child => {
          const details = Array.from(child.attributes).map(a => `${a.name}: ${a.value}`).join(', ');
          warnings.push(lname(child) + (details ? ` (${details})` : ''));
        });
      });
      return warnings;
    }

    function parseNode(relop, path, parent = null) {
      const runtime = runtimeAggregate(relop);
      const outputs = directWithin(relop, 'OutputList').flatMap(out => children(out, 'ColumnReference')).map(formatColumn).filter(Boolean);
      const defined = directWithin(relop, 'DefinedValue').flatMap(v => all(v, 'ColumnReference').filter(c => nearestAncestor(c, 'RelOp') === relop)).map(formatColumn).filter(Boolean);
      const object = directWithin(relop, 'Object')[0] || null;
      const physical = attr(relop, 'PhysicalOp', attr(relop, 'LogicalOp', 'RelOp'));
      const node = {
        id: path,
        nodeId: attr(relop, 'NodeId', path),
        physical,
        logical: attr(relop, 'LogicalOp'),
        estimatedRows: num(attr(relop, 'EstimateRows')),
        estimatedRowsRead: attr(relop, 'EstimatedRowsRead') ? num(attr(relop, 'EstimatedRowsRead')) : null,
        estimatedCost: num(attr(relop, 'EstimatedTotalSubtreeCost')),
        estimateCPU: num(attr(relop, 'EstimateCPU')),
        estimateIO: num(attr(relop, 'EstimateIO')),
        avgRowSize: num(attr(relop, 'AvgRowSize')),
        tableCardinality: attr(relop, 'TableCardinality') ? num(attr(relop, 'TableCardinality')) : null,
        estimateRebinds: num(attr(relop, 'EstimateRebinds')),
        estimateRewinds: num(attr(relop, 'EstimateRewinds')),
        parallel: bool(attr(relop, 'Parallel')),
        estimatedMode: attr(relop, 'EstimatedExecutionMode'),
        runtime,
        outputs,
        defined,
        expressions: extractExpressions(relop),
        warnings: extractWarnings(relop),
        object: object ? Object.fromEntries(Array.from(object.attributes).map(a => [a.name, a.value])) : {},
        objectLabel: objectLabel(relop),
        attributes: Object.fromEntries(Array.from(relop.attributes).map(a => [a.name, a.value])),
        memory: directWithin(relop, 'MemoryFractions').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))),
        spills: directWithin(relop, 'SpillToTempDb').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))),
        parent,
        children: [],
        el: relop,
        depth: parent ? parent.depth + 1 : 0,
        subtreeSize: 1,
        fingerprint: '',
        duplicateGroup: null,
        hiddenAsSubplan: false
      };
      node.children = directChildRelOps(relop).map((child, i) => parseNode(child, `${path}.${i}`, node));
      node.subtreeSize = 1 + node.children.reduce((s, c) => s + c.subtreeSize, 0);
      node.selfCost = Math.max(0, node.estimatedCost - node.children.reduce((s, c) => s + c.estimatedCost, 0));
      node.elapsed = runtime?.hasElapsed ? runtime.ActualElapsedms : null;
      node.selfTime = node.elapsed === null ? null : Math.max(0, node.elapsed - node.children.reduce((m, c) => Math.max(m, c.elapsed || 0), 0));
      return node;
    }

    function fingerprintNode(node) {
      const objectIdentity = [node.object.Database,node.object.Schema,node.object.Table,node.object.Index].filter(Boolean).join('.').toLowerCase();
      const expressions = node.expressions.map(x => x.replace(/Expr\d+/gi, 'Expr#').replace(/\s+/g, ' ').toLowerCase()).sort().join('|');
      const childPrints = node.children.map(fingerprintNode).join(',');
      node.fingerprint = `${node.physical}|${node.logical}|${objectIdentity}|${expressions}|[${childPrints}]`;
      return node.fingerprint;
    }

    function flatten(roots) {
      const result = [];
      const walk = n => { result.push(n); n.children.forEach(walk); };
      roots.forEach(walk);
      return result;
    }

    function detectReusableSubplans(statement) {
      const nodes = flatten(statement.roots);
      statement.roots.forEach(fingerprintNode);
      const candidates = new Map();
      nodes.filter(n => n.subtreeSize >= 3).forEach(n => {
        if (!candidates.has(n.fingerprint)) candidates.set(n.fingerprint, []);
        candidates.get(n.fingerprint).push(n);
      });
      const repeated = Array.from(candidates.values()).filter(group => group.length > 1).sort((a,b) => b[0].subtreeSize - a[0].subtreeSize);
      const claimed = new Set();
      statement.subplans = [];
      repeated.forEach(group => {
        const usable = group.filter(n => {
          let p = n.parent;
          while (p) { if (claimed.has(p.id)) return false; p = p.parent; }
          return true;
        });
        if (usable.length < 2) return;
        const item = { id: `sp-${statement.subplans.length + 1}`, number: statement.subplans.length + 1, root: usable[0], calls: usable };
        statement.subplans.push(item);
        usable.forEach(n => { n.duplicateGroup = item; claimed.add(n.id); });
      });
    }

    function statementForPlan(planEl, index) {
      const stmt = nearestStatement(planEl);
      const queryPlan = planEl;
      const topRelOps = all(queryPlan, 'RelOp').filter(r => nearestAncestor(r, 'QueryPlan') === queryPlan && !nearestAncestor(r, 'RelOp'));
      const roots = topRelOps.map((r, i) => parseNode(r, `s${index}.r${i}`));
      const statement = {
        index,
        type: stmt ? attr(stmt, 'StatementType', lname(stmt).replace(/^Stmt/, '')) : '',
        text: stmt ? attr(stmt, 'StatementText') : '',
        id: stmt ? attr(stmt, 'StatementId', String(index + 1)) : String(index + 1),
        subtreeCost: stmt ? num(attr(stmt, 'StatementSubTreeCost')) : (roots[0]?.estimatedCost || 0),
        roots,
        queryPlan: Object.fromEntries(Array.from(queryPlan.attributes).map(a => [a.name, a.value])),
        memoryGrant: first(queryPlan, 'MemoryGrantInfo') ? Object.fromEntries(Array.from(first(queryPlan, 'MemoryGrantInfo').attributes).map(a => [a.name,a.value])) : {},
        optimizerStats: first(queryPlan, 'OptimizerStatsUsage') ? all(first(queryPlan, 'OptimizerStatsUsage'),'StatisticsInfo').map(el => Object.fromEntries(Array.from(el.attributes).map(a => [a.name,a.value]))) : [],
        missingIndexes: extractMissingIndexes(queryPlan),
        subplans: []
      };
      detectReusableSubplans(statement);
      return statement;
    }

    function extractMissingIndexes(queryPlan) {
      return all(queryPlan, 'MissingIndexGroup').map(group => ({
        impact: attr(group, 'Impact'),
        indexes: children(group, 'MissingIndex').map(idx => ({
          table: ['Database','Schema','Table'].map(k => attr(idx,k)).filter(Boolean).join('.'),
          columns: all(idx, 'Column').map(c => `${attr(c,'Name')} (${attr(c.parentElement,'Usage') || 'COLUMN'})`)
        }))
      }));
    }

    function parseShowPlan(xmlText, fileName = t('defaultPlan')) {
      const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
      const error = all(xml, 'parsererror')[0];
      if (error) throw new Error(t('xmlParseError', { details: shortText(error.textContent, 180) }));
      const root = xml.documentElement;
      if (!root || lname(root) !== 'ShowPlanXML') throw new Error(t('expectedShowPlan'));
      const queryPlans = all(xml, 'QueryPlan').filter(q => !nearestAncestor(q, 'QueryPlan'));
      const statementEls = Array.from(xml.getElementsByTagNameNS('*','*')).filter(el => lname(el).startsWith('Stmt'));
      const statements = [];
      statementEls.forEach(stmt => {
        const ownedPlans = queryPlans.filter(q => nearestStatement(q) === stmt);
        if (ownedPlans.length) {
          ownedPlans.forEach(q => statements.push(statementForPlan(q, statements.length)));
        } else {
          statements.push({ index: statements.length, type: attr(stmt,'StatementType',lname(stmt).replace(/^Stmt/,'')), text: attr(stmt,'StatementText'), id: attr(stmt,'StatementId',String(statements.length+1)), subtreeCost: num(attr(stmt,'StatementSubTreeCost')), roots: [], queryPlan:{}, memoryGrant:{}, optimizerStats:[], missingIndexes:[], subplans:[] });
        }
      });
      queryPlans.filter(q => !nearestStatement(q)).forEach(q => statements.push(statementForPlan(q, statements.length)));
      if (!statements.length) throw new Error(t('noStatements'));
      const plan = {
        name: fileName.replace(/\.(sqlplan|sqplan|xml)$/i, ''),
        version: attr(root, 'Version'),
        build: attr(root, 'Build'),
        statements,
        nodeCount: statements.reduce((sum,s) => sum + flatten(s.roots).length, 0),
        actual: statements.some(s => flatten(s.roots).some(n => n.runtime))
      };
      return plan;
    }

    const historyStore = (() => {
      let dbPromise;
      function db() {
        if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
        if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('sql-server-plan-explorer', 1);
          req.onupgradeneeded = () => {
            const store = req.result.createObjectStore('plans', { keyPath: 'id' });
            store.createIndex('openedAt', 'openedAt');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return dbPromise;
      }
      async function tx(mode, fn) {
        const database = await db();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction('plans', mode);
          const store = transaction.objectStore('plans');
          const request = fn(store);
          transaction.oncomplete = () => resolve(request && request.result);
          transaction.onerror = () => reject(transaction.error);
        });
      }
      const fallbackKey = 'sql-server-plan-explorer-history';
      return {
        async list() {
          try { const items = await tx('readonly', s => s.getAll()); return (items || []).sort((a,b) => b.openedAt - a.openedAt); }
          catch { try { return JSON.parse(localStorage.getItem(fallbackKey) || '[]'); } catch { return []; } }
        },
        async save(item) {
          try { await tx('readwrite', s => s.put(item)); }
          catch { const items = await this.list(); const next = [item, ...items.filter(x => x.id !== item.id)].slice(0,10); localStorage.setItem(fallbackKey, JSON.stringify(next)); }
        },
        async remove(id) {
          try { await tx('readwrite', s => s.delete(id)); }
          catch { const items = await this.list(); localStorage.setItem(fallbackKey, JSON.stringify(items.filter(x => x.id !== id))); }
        },
        async clear() {
          try { await tx('readwrite', s => s.clear()); }
          catch { localStorage.removeItem(fallbackKey); }
        }
      };
    })();

    async function hashText(text) {
      if (crypto.subtle) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(digest)).slice(0,12).map(b => b.toString(16).padStart(2,'0')).join('');
      }
      let h = 2166136261;
      for (let i=0;i<text.length;i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
      return String(h >>> 0);
    }

    async function loadXml(xml, fileName, save = true) {
      const parsed = parseShowPlan(xml, fileName);
      state.plan = parsed;
      state.currentFile = fileName;
      state.currentXml = xml;
      state.statementIndex = 0;
      state.selectedId = parsed.statements[0].roots[0]?.id || null;
      state.zoom = 1;
      state.screen = 'viewer';
      els.emptyState.classList.add('hidden');
      els.viewer.classList.add('visible');
      els.homeSidebar.classList.add('hidden');
      els.planSidebar.classList.remove('hidden');
      els.menuBtn.classList.remove('hidden');
      els.historyBtn.classList.remove('hidden');
      els.detailsHandle.classList.toggle('visible', state.detailsLocked);
      if (state.detailsLocked) els.detailsDrawer.classList.remove('open');
      updateZoom();
      renderAll();
      if (save) {
        try {
          const id = await hashText(xml);
          await historyStore.save({ id, name: fileName, xml, openedAt: Date.now(), nodeCount: parsed.nodeCount, statements: parsed.statements.length, actual: parsed.actual });
          await refreshHistory();
        } catch (err) { toast(t('planSaveFailed'), true); }
      }
      toast(t('planOpened', { nodes: parsed.nodeCount }));
    }

    function currentStatement() { return state.plan?.statements[state.statementIndex] || null; }
    function currentNodes() { const s = currentStatement(); return s ? flatten(s.roots) : []; }
    function selectedNode() { return currentNodes().find(n => n.id === state.selectedId) || null; }

    function renderAll() {
      renderHeader();
      renderTabs();
      renderTree();
      renderGraph();
      const node = selectedNode();
      if (node) renderDetails(node);
    }

    function renderHeader() {
      const p = state.plan;
      els.planTitle.textContent = p.name;
      els.planMeta.textContent = `${p.actual ? t('actualPlan') : t('estimatedPlan')} · ${p.statements.length} ${t('statementsShort')} · ${p.nodeCount} ${t('nodesShort')}${p.build ? ' · build ' + p.build : ''}`;
    }

    function renderTabs() {
      const statements = state.plan.statements;
      els.statementTabs.classList.toggle('hidden', statements.length <= 1);
      els.statementTabs.innerHTML = statements.map((s,i) => `<button class="statement-tab ${i===state.statementIndex?'active':''}" data-index="${i}" title="${esc(shortText(s.text,180))}">${esc(t('queryNumber',{number:i+1}))} · ${esc(s.type || t('query'))}</button>`).join('');
    }

    function metricValues(node) {
      return state.metric === 'time' ? { subtree: node.elapsed, self: node.selfTime } : { subtree: node.estimatedCost, self: node.selfCost };
    }

    function renderTree() {
      const s = currentStatement();
      if (!s || !s.roots.length) {
        els.tree.innerHTML = `<div style="padding:20px;color:var(--muted)">${esc(t('noStatementGraph'))}</div>`;
        els.metricNotice.textContent = '';
        return;
      }
      const nodes = flatten(s.roots);
      const timeMissing = state.metric === 'time' && !nodes.some(n => n.runtime?.hasElapsed);
      if (timeMissing) els.metricNotice.textContent = t('timeUnavailable');
      else if (state.metric === 'rows') els.metricNotice.innerHTML = `<span class="rows-legend"><span><i class="metric-dot" style="background:#ff6574"></i>${esc(t('underShort'))}</span><span><i class="metric-dot" style="background:#5c9fff"></i>${esc(t('overShort'))}</span><span><i class="metric-dot" style="background:#4fd0a4"></i>${esc(t('closeShort'))}</span></span>`;
      else els.metricNotice.textContent = '';
      const maximum = state.metric === 'rows'
        ? Math.max(...nodes.flatMap(n => [n.estimatedRows, n.runtime?.hasRows ? n.runtime.ActualRows : 0]), 0.0000001)
        : Math.max(...s.roots.map(r => metricValues(r).subtree || 0), ...nodes.map(n => metricValues(n).subtree || 0), 0.0000001);
      const color = state.metric === 'time' ? 'var(--time)' : 'var(--cost)';
      els.tree.innerHTML = nodes.map(n => {
        if (state.metric === 'rows') {
          const estimated = n.estimatedRows;
          const hasActual = Boolean(n.runtime?.hasRows);
          const actual = hasActual ? n.runtime.ActualRows : null;
          const estimateWidth = Math.min(100, 100 * estimated / maximum);
          const actualWidth = actual === null ? 0 : Math.min(100, 100 * actual / maximum);
          const ratio = actual === null ? null : estimated === 0 ? (actual === 0 ? 1 : Infinity) : actual / estimated;
          const accuracy = ratio === null ? '' : ratio > 1.1 ? 'under' : ratio < .9 ? 'over' : 'close';
          const accuracyText = ratio === null ? t('noActualRows') : t(accuracy === 'under' ? 'underestimated' : accuracy === 'over' ? 'overestimated' : 'closeEstimate');
          return `<div class="tree-row ${n.id===state.selectedId?'selected':''}" data-id="${esc(n.id)}" style="--depth:${n.depth}">
            <div class="tree-name"><span class="tree-op">${n.duplicateGroup?'<span class="call-mark">↗</span>':''}${esc(n.physical)}</span><span class="tree-object">${esc(n.objectLabel || n.logical || '')}</span></div>
            <div class="tree-bar" title="${esc(t('estimate'))}: ${esc(formatNumber(estimated))}; ${esc(t('actual'))}: ${actual===null?t('missing'):esc(formatNumber(actual))}. ${esc(accuracyText)}"><span class="estimate" style="width:${estimateWidth}%"></span>${actual===null?'':`<span class="actual ${accuracy}" style="width:${actualWidth}%"></span>`}</div>
            <div class="tree-value" title="${esc(t('estimate'))} / ${esc(t('actual'))}">${formatNumber(estimated)} / ${actual===null?t('missing'):formatNumber(actual)}</div>
          </div>`;
        }
        const v = metricValues(n);
        const subWidth = Math.min(100, 100 * (v.subtree || 0) / maximum);
        const selfWidth = Math.min(subWidth, 100 * (v.self || 0) / maximum);
        const value = state.metric === 'time' ? formatMs(v.subtree) : formatNumber(v.subtree);
        return `<div class="tree-row ${n.id===state.selectedId?'selected':''}" data-id="${esc(n.id)}" style="--depth:${n.depth}">
          <div class="tree-name"><span class="tree-op">${n.duplicateGroup?'<span class="call-mark">↗</span>':''}${esc(n.physical)}</span><span class="tree-object">${esc(n.objectLabel || n.logical || '')}</span></div>
          <div class="tree-bar" title="${esc(t('subtree'))}: ${esc(value)}; ${esc(t('currentNode'))}: ${esc(state.metric==='time'?formatMs(v.self):formatNumber(v.self))}"><span class="subtree" style="width:${subWidth}%;background:${color}"></span><span class="self" style="width:${selfWidth}%;background:${color}"></span></div>
          <div class="tree-value">${esc(value)}</div>
        </div>`;
      }).join('');
      $$('#metricSwitch button', els.metricSwitch).forEach(b => b.classList.toggle('active', b.dataset.metric === state.metric));
    }

    function layoutGraph(statement) {
      const cardW = 220, cardH = 106, slotH = 164, gapX = 78, gapY = 24, pad = 24;
      let nextY = pad;
      const visibleChildren = node => node.duplicateGroup ? [] : node.children;
      function place(node, depth) {
        const kids = visibleChildren(node);
        kids.forEach(k => place(k, depth + 1));
        const y = kids.length ? (kids[0]._layout.y + kids[kids.length-1]._layout.y) / 2 : nextY;
        if (!kids.length) nextY += slotH + gapY;
        node._layout = { x: pad + depth * (cardW + gapX), y };
      }
      statement.roots.forEach((root, i) => { place(root, 0); if (i < statement.roots.length-1) nextY += 36; });
      const mainNodes = flatten(statement.roots).filter(n => {
        let p=n.parent; while(p){ if(p.duplicateGroup) return false; p=p.parent; } return true;
      });
      let maxX = Math.max(pad, ...mainNodes.map(n => n._layout.x + cardW));
      let mainBottom = Math.max(nextY, ...mainNodes.map(n => n._layout.y + slotH));
      const subplans = [];
      let subY = mainBottom + (statement.subplans.length ? 70 : 0);
      statement.subplans.forEach(sp => {
        const nodes = flatten([sp.root]);
        const baseDepth = sp.root.depth;
        let localY = subY + 43;
        function placeSub(node, depth) {
          node.children.forEach(c => placeSub(c, depth+1));
          const kids=node.children;
          const y=kids.length?(kids[0]._subLayout.y+kids[kids.length-1]._subLayout.y)/2:localY;
          if(!kids.length) localY += slotH+gapY;
          node._subLayout={x:pad+depth*(cardW+gapX),y};
        }
        placeSub(sp.root,0);
        const bottom=Math.max(localY,...nodes.map(n=>n._subLayout.y+slotH))+18;
        const right=Math.max(...nodes.map(n=>n._subLayout.x+cardW))+18;
        subplans.push({sp,nodes,x:12,y:subY,width:right,height:bottom-subY,bottom});
        maxX=Math.max(maxX,right);
        subY=bottom+24;
      });
      return { mainNodes, subplans, width:maxX+80, height:Math.max(mainBottom+50,subY+20), cardW, cardH };
    }

    function edgePath(a, b, cardW, cardH) {
      const x1=a.x+cardW, y1=a.y+cardH/2, x2=b.x, y2=b.y+cardH/2, mid=(x1+x2)/2;
      return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
    }

    function nodeCard(n, pos, sub = false) {
      const actualRows = n.runtime?.hasRows ? n.runtime.ActualRows : null;
      const subtitle = n.objectLabel || (n.expressions[0] ? shortText(n.expressions[0],70) : n.logical);
      const flags = [
        n.warnings.length?`<span class="flag warn" tabindex="0" data-tip="${esc(t('flagWarning'))}" title="${esc(t('flagWarning'))}" aria-label="${esc(t('flagWarning'))}">!</span>`:'',
        n.parallel?`<span class="flag parallel" tabindex="0" data-tip="${esc(t('flagParallel'))}" title="${esc(t('flagParallel'))}" aria-label="${esc(t('flagParallel'))}">∥</span>`:'',
        (n.estimatedMode==='Batch'||n.runtime?.ActualExecutionMode==='Batch')?`<span class="flag batch" tabindex="0" data-tip="${esc(t('flagBatch'))}" title="${esc(t('flagBatch'))}" aria-label="${esc(t('flagBatch'))}">B</span>`:''
      ].join('');
      const call = !sub && n.duplicateGroup;
      const subplanName = n.duplicateGroup ? t('reusableSubplan',{number:n.duplicateGroup.number}) : '';
      return `<article class="node-card ${n.id===state.selectedId?'selected expanded':''} ${n.warnings.length?'warning':''} ${call?'call-node':''}" data-id="${esc(n.id)}" style="left:${pos.x}px;top:${pos.y}px" title="${esc(t('clickNode'))}">
        <div class="node-top"><div class="node-title">${call?'↗ ':''}${esc(call ? subplanName : n.physical)}</div><div class="node-id">#${esc(n.nodeId)}</div></div>
        <div class="node-subtitle">${esc(call ? n.physical + (subtitle?' · '+subtitle:'') : subtitle || n.logical || '—')}</div><div class="node-flags">${flags}</div>
        <div class="node-stats"><div class="stat"><div class="stat-label">${esc(t('rowsEstimateActual'))}</div><div class="stat-value">${formatNumber(n.estimatedRows)} / ${actualRows===null?t('missing'):formatNumber(actualRows)}</div></div><div class="stat"><div class="stat-label">${esc(t('timeCost'))}</div><div class="stat-value">${formatMs(n.elapsed)} / ${formatNumber(n.estimatedCost)}</div></div></div>
        <div class="node-expanded"><div class="expanded-grid"><div class="expanded-item"><b>CPU</b><span>${n.runtime?.hasCPU?formatMs(n.runtime.ActualCPUms):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('logicalReads'))}</b><span>${n.runtime?formatNumber(n.runtime.ActualLogicalReads):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('executions'))}</b><span>${n.runtime?formatNumber(n.runtime.ActualExecutions):t('missing')}</span></div><div class="expanded-item"><b>${esc(t('outputColumns'))}</b><span>${formatNumber(n.outputs.length)}</span></div></div></div>
      </article>`;
    }

    function renderGraph() {
      const s = currentStatement();
      if (!s || !s.roots.length) {
        els.graph.innerHTML = `<div style="padding:30px;color:var(--muted)">${esc(t('noGraphFromServer'))}</div>`;
        els.graph.style.width='100%'; els.graph.style.height='100%'; return;
      }
      const layout = state.layout = layoutGraph(s);
      const edges=[];
      layout.mainNodes.forEach(n => {
        if(n.parent && layout.mainNodes.includes(n.parent) && !n.parent.duplicateGroup) edges.push(`<path class="edge" d="${edgePath(n.parent._layout,n._layout,layout.cardW,layout.cardH)}"/>`);
      });
      layout.subplans.forEach(zone => {
        zone.nodes.forEach(n => { if(n.parent && zone.nodes.includes(n.parent)) edges.push(`<path class="edge" d="${edgePath(n.parent._subLayout,n._subLayout,layout.cardW,layout.cardH)}"/>`); });
        zone.sp.calls.forEach(call => {
          const a=call._layout,b=zone.sp.root._subLayout;
          if(a) edges.push(`<path class="edge call" d="M ${a.x+layout.cardW/2} ${a.y+layout.cardH} C ${a.x+layout.cardW/2} ${a.y+layout.cardH+34}, ${b.x+layout.cardW/2} ${b.y-34}, ${b.x+layout.cardW/2} ${b.y}"/>`);
        });
      });
      const zones=layout.subplans.map(z=>`<div class="subplan-zone" style="left:${z.x}px;top:${z.y}px;width:${z.width}px;height:${z.height}px"><div class="subplan-label">↗ ${esc(t('reusableSubplan',{number:z.sp.number}))} · ${z.sp.calls.length} ${esc(t('calls'))}</div></div>`).join('');
      const mainCards=layout.mainNodes.map(n=>nodeCard(n,n._layout,false)).join('');
      const subCards=layout.subplans.flatMap(z=>z.nodes.map(n=>nodeCard(n,n._subLayout,true))).join('');
      els.graph.style.width=layout.width+'px'; els.graph.style.height=layout.height+'px';
      els.graph.innerHTML=`${zones}<svg class="edges" width="${layout.width}" height="${layout.height}" aria-hidden="true">${edges.join('')}</svg>${mainCards}${subCards}`;
      const selected=$(`.node-card[data-id="${CSS.escape(state.selectedId || '')}"]`,els.graph);
      if(selected) selected.classList.add('expanded');
      const meaningfulQuery = Boolean(s.text && !/^Statement\d+$/i.test(s.text.trim()));
      els.queryBtn.disabled = !meaningfulQuery;
      els.queryBtn.textContent = meaningfulQuery ? t('showQuery') : t('queryUnavailable');
      els.queryBtn.title = meaningfulQuery ? s.text : t('queryUnavailable');
    }

    function detailRows(entries, formatter = v => v) {
      return entries.filter(([,v]) => v !== '' && v !== null && v !== undefined).map(([k,v]) => `<div class="kv"><div class="k">${esc(k)}</div><div>${esc(formatter(v,k))}</div></div>`).join('');
    }

    function renderDetails(n) {
      els.drawerTitle.textContent = n.physical;
      els.drawerSubtitle.textContent = `${n.logical || t('operator')} · NodeId ${n.nodeId}${n.objectLabel?' · '+n.objectLabel:''}`;
      const actual = n.runtime;
      const primary = [
        [t('estimatedRows'), formatNumber(n.estimatedRows)], [t('actualRows'), actual?.hasRows ? formatNumber(actual.ActualRows) : t('missing')],
        [t('actualTime'), actual?.hasElapsed ? formatMs(actual.ActualElapsedms) : t('missing')], ['CPU', actual?.hasCPU ? formatMs(actual.ActualCPUms) : t('missing')],
        [t('subtreeCost'), formatNumber(n.estimatedCost)], [t('selfCost'), formatNumber(n.selfCost)],
        [t('executions'), actual ? formatNumber(actual.ActualExecutions) : t('missing')], [t('mode'), actual?.ActualExecutionMode || n.estimatedMode || 'Row']
      ];
      const io = actual ? [
        [t('logicalReads'),formatNumber(actual.ActualLogicalReads)],[t('physicalReads'),formatNumber(actual.ActualPhysicalReads)],[t('readAhead'),formatNumber(actual.ActualReadAheads)],
        [t('lobLogicalReads'),formatNumber(actual.ActualLobLogicalReads)],[t('lobPhysicalReads'),formatNumber(actual.ActualLobPhysicalReads)],[t('scans'),formatNumber(actual.ActualScans)]
      ] : [];
      const estimates = [['Estimate CPU',formatNumber(n.estimateCPU)],['Estimate IO',formatNumber(n.estimateIO)],[t('averageRowSize'),formatNumber(n.avgRowSize)+' B'],[t('estimatedRowsRead'),n.estimatedRowsRead===null?t('missing'):formatNumber(n.estimatedRowsRead)],[t('tableCardinality'),n.tableCardinality===null?t('missing'):formatNumber(n.tableCardinality)],['Rebinds / Rewinds',`${formatNumber(n.estimateRebinds)} / ${formatNumber(n.estimateRewinds)}`]];
      const objectRows = Object.entries(n.object);
      const attributeRows = Object.entries(n.attributes).filter(([k]) => !['NodeId','PhysicalOp','LogicalOp','EstimateRows','EstimatedTotalSubtreeCost','EstimateCPU','EstimateIO'].includes(k));
      els.drawerBody.innerHTML = `
        <section class="detail-section"><h3>${esc(t('primaryMetrics'))}</h3>${detailRows(primary)}</section>
        ${io.length?`<section class="detail-section"><h3>${esc(t('ioAndCache'))}</h3>${detailRows(io)}</section>`:''}
        ${n.warnings.length?`<section class="detail-section"><h3>${esc(t('warnings'))}</h3><div class="chip-list">${n.warnings.map(x=>`<span class="chip" style="border-color:#705e2b;color:#f4d77c">${esc(x)}</span>`).join('')}</div></section>`:''}
        ${objectRows.length?`<section class="detail-section"><h3>${esc(t('object'))}</h3>${detailRows(objectRows)}</section>`:''}
        ${n.expressions.length?`<section class="detail-section"><h3>${esc(t('operandsPredicates'))}</h3>${n.expressions.map(x=>`<div class="expression">${esc(x)}</div>`).join('')}</section>`:''}
        ${n.outputs.length?`<section class="detail-section"><h3>${esc(t('outputColumns'))} (${n.outputs.length})</h3><div class="chip-list">${n.outputs.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`:''}
        ${n.defined.length?`<section class="detail-section"><h3>${esc(t('definedValues'))}</h3><div class="chip-list">${n.defined.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section>`:''}
        <section class="detail-section"><h3>${esc(t('optimizerEstimates'))}</h3>${detailRows(estimates)}</section>
        ${n.spills.length?`<section class="detail-section"><h3>Spill to tempdb</h3>${n.spills.map(x=>detailRows(Object.entries(x))).join('')}</section>`:''}
        <section class="detail-section"><h3>${esc(t('showPlanAttributes'))}</h3>${detailRows(attributeRows)}</section>
        ${actual&&actual.threadRows.length>1?`<section class="detail-section"><h3>${esc(t('threads'))} (${actual.threadRows.length})</h3>${actual.threadRows.map(row=>detailRows([[t('thread'),row.Thread],[t('rows'),row.ActualRows],[t('elapsed'),row.ActualElapsedms?formatMs(row.ActualElapsedms):t('missing')],['CPU',row.ActualCPUms?formatMs(row.ActualCPUms):t('missing')],[t('logicalReads'),row.ActualLogicalReads||t('missing')]])).join('')}</section>`:''}`;
    }

    function selectNode(id) {
      state.selectedId = id;
      renderTree(); renderGraph();
      const node=selectedNode();
      if(node) renderDetails(node);
      if(!state.detailsLocked) els.detailsDrawer.classList.add('open');
    }

    function renderHistoryLists() {
      if (!els.historyList || !els.homeHistoryList) return;
      const html = state.history.length ? state.history.map(item => {
        const date = new Date(item.openedAt).toLocaleString(locale === 'ru' ? 'ru-RU' : 'en-GB');
        return `<div class="history-item" data-id="${esc(item.id)}"><div><div class="history-name">${esc(item.name)}</div><div class="history-meta">${esc(t('historyMeta',{date,statements:item.statements||'?',nodes:item.nodeCount??'?'}))}</div></div><button class="history-delete" data-delete="${esc(item.id)}" title="${esc(t('delete'))}" aria-label="${esc(t('delete'))}">×</button></div>`;
      }).join('') : `<div style="padding:22px;color:var(--muted);text-align:center">${esc(t('emptyHistory'))}</div>`;
      els.historyList.innerHTML = html;
      els.homeHistoryList.innerHTML = html;
      els.historyCount.textContent = state.history.length ? `(${state.history.length})` : '';
    }

    async function refreshHistory() {
      state.history = await historyStore.list();
      renderHistoryLists();
    }

    function openHistory(open) {
      els.historyPanel.classList.toggle('open',open);
      els.overlay.classList.toggle('open',open);
      if(open) refreshHistory();
    }

    function showHome() {
      state.screen = 'home';
      els.viewer.classList.remove('visible');
      els.emptyState.classList.remove('hidden');
      els.planSidebar.classList.add('hidden');
      els.homeSidebar.classList.remove('hidden');
      els.menuBtn.classList.add('hidden');
      els.historyBtn.classList.add('hidden');
      els.detailsDrawer.classList.remove('open');
      els.detailsHandle.classList.remove('visible');
      openHistory(false);
      els.pasteBox.value='';
      els.planNameInput.value='';
      refreshHistory();
    }

    function toast(message,error=false) {
      els.toast.textContent=message; els.toast.classList.toggle('error',error); els.toast.classList.add('show');
      clearTimeout(toast.timer); toast.timer=setTimeout(()=>els.toast.classList.remove('show'),2600);
    }

    async function readFile(file) {
      if(!file) return;
      if(file.size > 30*1024*1024) { toast(t('fileTooLarge'),true); return; }
      const displayName = els.planNameInput.value.trim() || file.name;
      try { await loadXml(await file.text(),displayName,true); }
      catch(err) { toast(err.message || t('openFailed'),true); }
    }

    function setDetailsLocked(locked) {
      state.detailsLocked = locked;
      els.hideDetailsCheck.checked = locked;
      els.detailsHandle.classList.toggle('visible', locked && state.screen === 'viewer');
      if (locked) els.detailsDrawer.classList.remove('open');
    }

    function updateZoom() {
      els.graph.style.transform = `scale(${state.zoom})`;
      els.zoomLabel.textContent = `${Math.round(state.zoom * 100)}%`;
    }

    async function historyClick(e) {
      const del=e.target.closest('[data-delete]');
      if(del){e.stopPropagation();await historyStore.remove(del.dataset.delete);await refreshHistory();return;}
      const item=e.target.closest('.history-item');
      if(!item)return;
      const saved=state.history.find(x=>x.id===item.dataset.id);
      if(saved){try{await loadXml(saved.xml,saved.name,false);openHistory(false);}catch(err){toast(err.message,true);}}
    }

    async function clearHistory() {
      if(!state.history.length || !confirm(t('clearConfirm'))) return;
      await historyStore.clear();
      await refreshHistory();
      toast(t('historyCleared'));
    }

    els.chooseBtn.onclick = () => els.fileInput.click();
    els.menuBtn.onclick = showHome;
    els.fileInput.onchange = () => { readFile(els.fileInput.files[0]); els.fileInput.value=''; };
    els.parsePasteBtn.onclick = async () => { const xml=els.pasteBox.value.trim(); if(!xml)return toast(t('pasteFirst'),true); const name=els.planNameInput.value.trim()||`${t('pastedPlan')}.sqlplan`; try{await loadXml(xml,name,true);}catch(err){toast(err.message,true);} };
    ['dragenter','dragover'].forEach(type => document.addEventListener(type,e=>{e.preventDefault();els.dropCard.classList.add('drag');}));
    ['dragleave','drop'].forEach(type => document.addEventListener(type,e=>{e.preventDefault();els.dropCard.classList.remove('drag');}));
    document.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
    els.statementTabs.addEventListener('click',e=>{ const b=e.target.closest('[data-index]'); if(!b)return; state.statementIndex=Number(b.dataset.index); const s=currentStatement(); state.selectedId=s.roots[0]?.id||null; renderAll(); });
    els.metricSwitch.addEventListener('click',e=>{ const b=e.target.closest('[data-metric]'); if(!b)return; state.metric=b.dataset.metric; renderTree(); });
    els.tree.addEventListener('click',e=>{if(state.dragMoved){state.dragMoved=false;return;}const row=e.target.closest('[data-id]');if(row)selectNode(row.dataset.id);});
    els.graph.addEventListener('click',e=>{if(state.dragMoved){state.dragMoved=false;return;}const card=e.target.closest('.node-card[data-id]');if(card)selectNode(card.dataset.id);});
    els.detailsBtn.onclick=()=>{const n=selectedNode();if(!n)return;if(state.detailsLocked)setDetailsLocked(false);renderDetails(n);els.detailsDrawer.classList.toggle('open');};
    els.closeDetails.onclick=()=>els.detailsDrawer.classList.remove('open');
    els.hideDetailsCheck.onchange=()=>setDetailsLocked(els.hideDetailsCheck.checked);
    els.detailsHandle.onclick=()=>{setDetailsLocked(false);const n=selectedNode();if(n)renderDetails(n);els.detailsDrawer.classList.add('open');};
    els.fitBtn.onclick=()=>{state.zoom=1;updateZoom();els.canvasWrap.scrollTo({left:0,top:0,behavior:'smooth'});};
    els.queryBtn.onclick=()=>{if(els.queryBtn.disabled)return;els.queryText.textContent=currentStatement()?.text||t('queryUnavailable');els.queryModal.classList.add('open');};
    els.closeQuery.onclick=()=>els.queryModal.classList.remove('open');
    els.queryModal.addEventListener('click',e=>{if(e.target===els.queryModal)els.queryModal.classList.remove('open');});
    els.historyBtn.onclick=()=>openHistory(true); els.closeHistory.onclick=els.overlay.onclick=()=>openHistory(false);
    els.historyList.addEventListener('click',historyClick);
    els.homeHistoryList.addEventListener('click',historyClick);
    els.clearHistoryBtn.onclick=els.homeClearHistoryBtn.onclick=clearHistory;
    els.languageSelect.onchange=()=>{locale=els.languageSelect.value;localStorage.setItem('sql-plan-language',locale);applyI18n();};
    window.addEventListener('keydown',e=>{if(e.key==='Escape'){els.queryModal.classList.remove('open');els.detailsDrawer.classList.remove('open');openHistory(false);}});

    let graphPan = null;
    els.canvasWrap.addEventListener('pointerdown',e=>{if(e.button!==0)return;graphPan={x:e.clientX,y:e.clientY,left:els.canvasWrap.scrollLeft,top:els.canvasWrap.scrollTop};state.dragMoved=false;els.canvasWrap.setPointerCapture(e.pointerId);els.canvasWrap.classList.add('panning');});
    els.canvasWrap.addEventListener('pointermove',e=>{if(!graphPan)return;const dx=e.clientX-graphPan.x,dy=e.clientY-graphPan.y;if(Math.abs(dx)+Math.abs(dy)>4)state.dragMoved=true;els.canvasWrap.scrollLeft=graphPan.left-dx;els.canvasWrap.scrollTop=graphPan.top-dy;});
    const endGraphPan=()=>{graphPan=null;els.canvasWrap.classList.remove('panning');};
    els.canvasWrap.addEventListener('pointerup',endGraphPan);els.canvasWrap.addEventListener('pointercancel',endGraphPan);
    els.canvasWrap.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const old=state.zoom;const factor=Math.exp(-e.deltaY*.0015);const next=Math.max(.35,Math.min(2.5,old*factor));if(Math.abs(next-old)<.001)return;const rect=els.canvasWrap.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;const contentX=(els.canvasWrap.scrollLeft+px)/old,contentY=(els.canvasWrap.scrollTop+py)/old;state.zoom=next;updateZoom();requestAnimationFrame(()=>{els.canvasWrap.scrollLeft=contentX*next-px;els.canvasWrap.scrollTop=contentY*next-py;});},{passive:false});

    let treePan = null;
    els.tree.addEventListener('pointerdown',e=>{if(e.button!==0||!e.ctrlKey)return;e.preventDefault();treePan={x:e.clientX,y:e.clientY,left:els.tree.scrollLeft,top:els.tree.scrollTop};state.dragMoved=false;els.tree.setPointerCapture(e.pointerId);els.tree.classList.add('ctrl-panning');});
    els.tree.addEventListener('pointermove',e=>{if(!treePan)return;const dx=e.clientX-treePan.x,dy=e.clientY-treePan.y;if(Math.abs(dx)+Math.abs(dy)>4)state.dragMoved=true;els.tree.scrollLeft=treePan.left-dx;els.tree.scrollTop=treePan.top-dy;});
    const endTreePan=()=>{treePan=null;els.tree.classList.remove('ctrl-panning');};
    els.tree.addEventListener('pointerup',endTreePan);els.tree.addEventListener('pointercancel',endTreePan);

    let resizing=false;
    els.resizer.addEventListener('pointerdown',e=>{resizing=true;els.resizer.setPointerCapture(e.pointerId);els.resizer.classList.add('dragging');});
    els.resizer.addEventListener('pointermove',e=>{if(!resizing)return;const width=Math.max(270,Math.min(window.innerWidth*.65,e.clientX));document.documentElement.style.setProperty('--left-width',width+'px');});
    els.resizer.addEventListener('pointerup',()=>{resizing=false;els.resizer.classList.remove('dragging');});

    applyI18n();
    refreshHistory().catch(()=>{});
  })();
  </script>
</body>
</html>
