<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSQPE — SQL Server Query Plan Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --surface: #181d27;
      --surface-2: #202735;
      --surface-3: #293244;
      --border: #333e52;
      --muted: #94a0b5;
      --text: #edf1f7;
      --accent: #55b6ff;
      --accent-2: #8b7dff;
      --time: #42c89c;
      --cost: #e9aa57;
      --danger: #ff6d7a;
      --warning: #f4cb62;
      --left-width: 410px;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { color: var(--text); }
    .app { height: 100%; display: grid; grid-template-rows: 54px minmax(0, 1fr); }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); background: #141923; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 720; letter-spacing: .1px; white-space: nowrap; }
    .logo { min-width: 50px; height: 27px; padding: 0 7px; display: grid; place-items: center; border-radius: 8px; color: #08131b; background: linear-gradient(135deg, var(--accent), #5fe0bd); font-size: 12px; font-weight: 900; letter-spacing: .4px; }
    .app-version { margin-left: -5px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .25px; }
    .top-actions { display: flex; gap: 8px; margin-left: auto; }
    .language-control { position: relative; display: inline-flex; align-items: center; min-width: 118px; }
    .language-flag { position: absolute; left: 9px; z-index: 1; display: grid; place-items: center; width: 22px; height: 14px; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.24); pointer-events: none; }
    .language-flag svg { display: block; width: 100%; height: 100%; }
    .language-select { width: 100%; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px 6px 39px; cursor: pointer; }
    .btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 7px 11px; cursor: pointer; transition: .15s; white-space: nowrap; }
    .btn:hover { border-color: #526079; background: var(--surface-3); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn.primary { color: #07131c; border-color: transparent; background: var(--accent); font-weight: 700; }
    .btn.danger { color: #ffb6bc; }
    .file-input { display: none; }
    .workspace { display: grid; grid-template-columns: var(--left-width) 6px minmax(0, 1fr); min-height: 0; }
    .sidebar { min-width: 0; background: var(--surface); overflow: hidden; }
    .plan-sidebar { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    .home-sidebar { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr); }
    .home-sidebar-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
    .home-sidebar-head h2 { margin: 0; flex: 1; font-size: 15px; }
    .resizer { cursor: col-resize; background: transparent; border-left: 1px solid var(--border); border-right: 1px solid transparent; }
    .resizer:hover, .resizer.dragging { background: #263650; border-color: var(--accent); }
    .plan-head { padding: 13px 14px 11px; border-bottom: 1px solid var(--border); }
    .plan-title { font-size: 14px; font-weight: 720; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-meta { color: var(--muted); margin-top: 3px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plan-stats { display: flex; flex-wrap: wrap; gap: 2px 11px; margin-top: 3px; color: #b4bfce; font-size: 11px; font-variant-numeric: tabular-nums; }
    .plan-stats:empty { display: none; }
    .plan-stat { white-space: nowrap; }
    .plan-stat b { color: var(--muted); font-weight: 500; }
    .statement-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
    .statement-tab { border: 1px solid var(--border); background: transparent; border-radius: 6px; padding: 5px 9px; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .statement-tab.active { color: var(--text); border-color: var(--accent); background: #1b3145; }
    .tree-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
    .metric-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .metric-expand { margin-right: auto; padding: 4px 8px; }
    .metric-notice { flex: 0 0 100%; color: var(--warning); font-size: 11px; min-height: 0; }
    .metric-notice:empty { display: none; }
    .rows-legend { display: flex; flex-wrap: wrap; gap: 9px; color: var(--muted); }
    .metric-dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; }
    .segmented { display: inline-flex; padding: 2px; gap: 2px; background: #10151e; border: 1px solid var(--border); border-radius: 7px; }
    .segmented button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 5px; }
    .segmented button.active { color: var(--text); background: var(--surface-3); }
    .tree { overflow: auto; padding: 7px 0 24px; cursor: grab; user-select: none; overscroll-behavior: contain; }
    .tree.panning { cursor: grabbing; }
    .tree-content { min-width: 100%; }
    .tree-row { --tree-row-bg: var(--surface); position: relative; isolation: isolate; width: 100%; height: 39px; display: flex; align-items: center; gap: 7px; padding: 0 9px; cursor: pointer; border-left: 2px solid transparent; }
    .tree-row:hover { --tree-row-bg: #202735; background: var(--tree-row-bg); }
    .tree-row.selected { --tree-row-bg: #233148; background: var(--tree-row-bg); border-left-color: var(--accent); }
    .tree-name { position: relative; z-index: 0; min-width: 0; flex: 1 1 auto; overflow: hidden; }
    .tree-op { display: block; padding-left: calc(var(--depth) * 15px + 29px); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-object { display: block; padding-left: calc(var(--depth) * 15px + 29px); color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-toggle { position: absolute; left: calc(6px + var(--depth) * 15px); top: 4px; z-index: 4; width: 27px; height: 31px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 21px; line-height: 1; opacity: 0; pointer-events: auto; transition: opacity .1s, color .1s; }
    .tree-row:hover .tree-toggle, .tree-toggle:focus-visible { opacity: 1; }
    .tree-toggle:hover { color: var(--text); }
    .tree-metrics { position: sticky; right: 0; z-index: 5; flex: 0 0 215px; width: 215px; height: 100%; margin-right: -9px; padding: 0 9px; display: flex; align-items: center; gap: 7px; background: var(--tree-row-bg); }
    .tree-bar { flex: 0 0 118px; width: 118px; height: 18px; position: relative; isolation: isolate; overflow: hidden; border-radius: 4px; background-color: #0b1018; background-image: linear-gradient(#0b1018,#0b1018); box-shadow: inset 0 0 0 1px #2b3546; }
    .tree-bar::before { content: ''; position: absolute; inset: 0; z-index: 0; background: #0b1018; }
    .tree-bar .subtree, .tree-bar .self { position: absolute; z-index: 1; left: 0; top: 0; bottom: 0; min-width: 0; }
    .tree-bar .subtree { opacity: .27; }
    .tree-bar .self { opacity: .92; }
    .tree-bar .time-elapsed, .tree-bar .time-current { position: absolute; z-index: 1; left: 0; top: 0; bottom: 0; min-width: 0; background: var(--time); }
    .tree-bar .time-elapsed { opacity: .3; }
    .tree-bar .time-current { opacity: .95; }
    .tree-bar .rows-segment { position: absolute; z-index: 1; top: 0; bottom: 0; min-width: 0; }
    .tree-bar .rows-estimate.severity-0 { background: #34485a; }
    .tree-bar .rows-actual.severity-0 { background: #4fd0a4; }
    .tree-bar .rows-estimate.severity-2 { background: #68591f; }
    .tree-bar .rows-actual.severity-2 { background: #fddb61; }
    .tree-bar .rows-estimate.severity-3 { background: #683d17; }
    .tree-bar .rows-actual.severity-3 { background: #ee8800; }
    .tree-bar .rows-estimate.severity-4 { background: #68252c; }
    .tree-bar .rows-actual.severity-4 { background: #ff5964; }
    .tree-value { flex: 0 0 72px; width: 72px; text-align: right; color: #c4cbd8; font-variant-numeric: tabular-nums; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .call-mark { color: var(--accent-2); margin-right: 4px; }
    .main { min-width: 0; min-height: 0; position: relative; overflow: hidden; background: radial-gradient(circle at 10% 0%, #192233 0, transparent 38%), var(--bg); }
    .empty { height: 100%; display: grid; place-items: center; padding: 30px; }
    .drop-card { width: min(670px, 92%); border: 1px dashed #52617a; border-radius: 15px; padding: 42px; text-align: center; background: rgba(24,29,39,.86); }
    .drop-card.drag { border-color: var(--accent); background: #1c2a3a; }
    .drop-icon { margin: 0 auto 16px; width: 58px; height: 58px; display: grid; place-items: center; border-radius: 16px; background: #20344a; color: var(--accent); font-size: 28px; }
    .drop-card h1 { margin: 0 0 8px; font-size: 22px; }
    .drop-card p { margin: 0 auto 18px; color: var(--muted); max-width: 500px; }
    .paste-box { width: 100%; height: 104px; resize: vertical; color: var(--text); background: #0f141d; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 18px; outline: none; }
    .paste-box:focus { border-color: var(--accent); }
    .plan-name-field { width: 100%; color: var(--text); background: #0f141d; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin: 0 0 12px; outline: none; }
    .plan-name-field:focus { border-color: var(--accent); }
    .viewer { height: 100%; display: none; grid-template-rows: auto minmax(0, 1fr); }
    .viewer.visible { display: grid; }
    .viewer-toolbar { min-height: 45px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); background: rgba(20,25,35,.93); }
    .viewer-toolbar .spacer { flex: 1; }
    .query-button { max-width: min(48vw, 560px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .canvas-wrap { overflow: auto; position: relative; cursor: grab; user-select: none; overscroll-behavior: contain; }
    .canvas-wrap.panning { cursor: grabbing; }
    .canvas-wrap.panning .graph { pointer-events: none; }
    .graph-stage { position: relative; min-width: 100%; min-height: 100%; }
    .graph { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: #53627b; stroke-width: 1.5; }
    .edge.call { stroke: var(--accent-2); stroke-dasharray: 5 5; stroke-width: 1.8; }
    .edge-arrow { fill: var(--accent-2); }
    .node-card { position: absolute; width: 220px; min-height: 106px; border: 1px solid #3a465b; border-radius: var(--radius); background: #1b212c; box-shadow: 0 4px 13px rgba(0,0,0,.24); cursor: pointer; overflow: visible; content-visibility: auto; contain-intrinsic-size: 220px 106px; transition: border-color .13s, box-shadow .13s; }
    .node-card:hover { content-visibility: visible; border-color: #63738d; }
    .node-card:focus-within, .node-card.selected { content-visibility: visible; }
    .node-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(85,182,255,.14), 0 5px 17px rgba(0,0,0,.3); z-index: 5; }
    .node-card.warning { border-top-color: var(--warning); }
    .node-card.call-node { border-color: #655db0; background: #201f35; }
    .node-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 9px 10px 5px; }
    .node-title { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-id { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
    .node-subtitle { padding: 0 10px 7px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
    .node-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #30394a; }
    .stat { padding: 6px 8px; min-width: 0; }
    .stat + .stat { border-left: 1px solid #30394a; }
    .stat-label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .45px; }
    .stat-value { margin-top: 1px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .node-expanded { display: none; padding: 8px 10px 10px; border-top: 1px solid #30394a; color: #cbd3e1; }
    .node-card.expanded { width: 278px; z-index: 8; }
    .node-card.expanded .node-expanded { display: block; }
    .expanded-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
    .expanded-item b { display: block; color: var(--muted); font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .expanded-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-flags { display: flex; gap: 4px; position: absolute; right: 7px; top: 31px; }
    .flag { position: relative; display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 4px; background: #30394a; color: #d4dbea; font-size: 9px; font-weight: 800; }
    .flag::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 6px); width: max-content; max-width: 220px; padding: 5px 7px; border: 1px solid #516079; border-radius: 5px; background: #111722; color: var(--text); font-size: 11px; font-weight: 500; line-height: 1.3; white-space: normal; opacity: 0; transform: translateY(3px); pointer-events: none; transition: .12s; box-shadow: 0 5px 14px rgba(0,0,0,.35); z-index: 20; }
    .flag:hover::after, .flag:focus-visible::after { opacity: 1; transform: translateY(0); }
    .flag.warn { background: #5d4b1e; color: var(--warning); }
    .flag.parallel { background: #243f62; color: #8bc8ff; }
    .flag.batch { background: #244b42; color: #72dbbd; }
    .performance-badges { display: inline-flex; align-items: center; gap: 3px; margin-left: 5px; vertical-align: -2px; }
    .performance-badge { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; background: color-mix(in srgb, currentColor 20%, #18202c); cursor: help; }
    .performance-badge svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .performance-badge.severity-2 { color: #fddb61; }
    .performance-badge.severity-3 { color: #ee8800; }
    .performance-badge.severity-4 { color: #ff5964; }
    .performance-badge::after { content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 6px); width: max-content; max-width: 260px; padding: 5px 7px; border: 1px solid #516079; border-radius: 5px; background: #111722; color: var(--text); font-size: 11px; font-weight: 500; line-height: 1.35; white-space: normal; opacity: 0; transform: translateY(3px); pointer-events: none; transition: .12s; box-shadow: 0 5px 14px rgba(0,0,0,.35); z-index: 25; }
    .performance-badge:hover::after, .performance-badge:focus-visible::after { opacity: 1; transform: translateY(0); }
    .subplan-zone { position: absolute; border: 1px dashed #5c557f; background: rgba(43,39,70,.22); border-radius: 13px; }
    .subplan-label { position: absolute; left: 12px; top: 9px; color: #b7aefa; font-weight: 700; }
    .details-drawer { position: absolute; top: 45px; right: 0; bottom: 0; width: min(430px, 88%); z-index: 30; transform: translateX(102%); transition: transform .18s ease; background: #171c26; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.28); display: grid; grid-template-rows: auto minmax(0,1fr); }
    .details-drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-bottom: 1px solid var(--border); }
    .drawer-head-text { min-width: 0; flex: 1; }
    .drawer-lock { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; cursor: pointer; }
    .drawer-title { font-size: 16px; font-weight: 750; }
    .drawer-subtitle { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 7px; font-size: 18px; }
    .drawer-body { overflow: auto; padding: 12px 14px 30px; }
    .details-handle { display: none; position: absolute; right: 0; top: 105px; z-index: 31; border: 1px solid var(--accent); border-right: 0; border-radius: 7px 0 0 7px; background: #20334a; color: #bfe4ff; padding: 11px 6px; cursor: pointer; writing-mode: vertical-rl; }
    .details-handle.visible { display: block; }
    .detail-section { margin-bottom: 16px; }
    .detail-heading { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .detail-section h3 { flex: 1; margin: 0; color: #c8d1df; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
    .detail-section summary { display: flex; align-items: center; gap: 6px; color: #c8d1df; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; cursor: pointer; user-select: none; list-style: none; }
    .detail-section summary::-webkit-details-marker { display: none; }
    .detail-section summary::before { content: '›'; color: var(--accent); font-size: 18px; line-height: 11px; transform-origin: center; transition: transform .12s; }
    .detail-section[open] summary::before { transform: rotate(90deg); }
    .detail-section .detail-content { margin-top: 7px; }
    .detail-copy-button { flex: 0 0 22px; width: 22px; height: 22px; margin-left: auto; display: inline-grid; place-items: center; padding: 0; border: 1px solid #3b475b; border-radius: 4px; background: #202837; color: var(--muted); cursor: pointer; }
    .detail-copy-button:hover, .detail-copy-button:focus-visible { color: var(--text); border-color: #61718a; background: #283346; outline: none; }
    .detail-copy-button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
    .detail-note { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .kv { display: grid; grid-template-columns: minmax(120px, 44%) minmax(0, 1fr); border-top: 1px solid #2b3444; }
    .kv > div { padding: 5px 2px; overflow-wrap: anywhere; }
    .kv .k { color: var(--muted); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { padding: 4px 7px; border-radius: 5px; background: #252d3c; border: 1px solid #343f52; overflow-wrap: anywhere; }
    .expression { white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px; border-radius: 6px; background: #0f141c; border: 1px solid #2d3646; color: #d5dbe7; }
    .history-panel { position: fixed; top: 54px; right: 0; bottom: 0; z-index: 70; width: min(420px, 92vw); transform: translateX(102%); transition: .2s; background: #171c26; border-left: 1px solid var(--border); box-shadow: -12px 0 35px rgba(0,0,0,.4); display: grid; grid-template-rows: auto minmax(0,1fr); }
    .history-panel.open { transform: translateX(0); }
    .history-head { display: flex; align-items: center; gap: 8px; padding: 14px; border-bottom: 1px solid var(--border); }
    .history-head h2 { margin: 0; font-size: 16px; flex: 1; }
    .history-list { overflow: auto; padding: 8px; }
    .history-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 10px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
    .history-item:hover { background: var(--surface-2); border-color: var(--border); }
    .history-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .history-delete { align-self: center; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; }
    .history-delete:hover { color: var(--danger); }
    .overlay { display: none; position: fixed; inset: 54px 0 0; z-index: 60; background: rgba(0,0,0,.38); }
    .overlay.open { display: block; }
    .modal { display: none; position: fixed; z-index: 90; inset: 0; place-items: center; background: rgba(4,7,11,.7); padding: 20px; }
    .modal.open { display: grid; }
    .modal-card { width: min(760px, 96vw); max-height: 82vh; display: grid; grid-template-rows: auto minmax(0,1fr); background: #181e28; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.5); overflow: hidden; }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 15px; flex: 1; }
    .query-text { min-width: 0; min-height: 0; margin: 0; padding: 15px; overflow: auto; white-space: pre; overflow-wrap: normal; color: #d9e2ef; background: #11161f; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; scrollbar-gutter: stable; }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 100; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 9px 13px; border-radius: 7px; background: #273246; border: 1px solid #44516a; box-shadow: 0 6px 20px rgba(0,0,0,.35); transition: .18s; }
    .toast.show { transform: translate(-50%,0); opacity: 1; }
    .toast.error { border-color: #8d3d48; color: #ffb9c0; }
    .zoom-label { min-width: 45px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    @media (max-width: 850px) {
      :root { --left-width: 310px; }
      .brand-title { display: none; }
      .tree-metrics { flex-basis: 171px; width: 171px; }
      .tree-bar { flex-basis: 88px; width: 88px; }

    if (!I18N[locale]) locale = 'en';
    const t = (key, values = {}) => {
      let text = I18N[locale][key] ?? I18N.en[key] ?? key;
      Object.entries(values).forEach(([name, value]) => text = text.replaceAll(`{${name}}`, value));
      return text;
    };

    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
    const els = Object.fromEntries([
      'fileInput','menuBtn','historyBtn','historyCount','languageSelect','languageFlag','chooseBtn','planNameInput','pasteBox','parsePasteBtn','dropCard','emptyState','viewer','homeSidebar','homeHistoryList','homeClearHistoryBtn','planSidebar','planTitle','planMeta','planStats','statementTabs','metricSwitch','metricNotice','expandAllBtn','tree','main','canvasWrap','graphStage','graph','queryBtn','rawPlanBtn','fitBtn','zoomLabel','detailsDrawer','detailsHandle','hideDetailsCheck','drawerTitle','drawerSubtitle','drawerBody','closeDetails','historyPanel','historyList','clearHistoryBtn','closeHistory','overlay','queryModal','queryText','textModalTitle','copyTextBtn','closeQuery','toast','resizer'

      if (state.plan) renderAll();
      renderHistoryLists();
    }

    const lname = el => el && (el.localName || el.nodeName.split(':').pop());
    const all = (root, name) => Array.from(root.getElementsByTagNameNS('*', name));
    const children = (root, name) => Array.from(root.children || []).filter(el => !name || lname(el) === name);
    const first = (root, name) => all(root, name)[0] || null;
    const attr = (el, name, fallback = '') => el && el.hasAttribute(name) ? el.getAttribute(name) : fallback;
    const num = value => Number.isFinite(Number(value)) ? Number(value) : 0;
    const bool = value => value === '1' || String(value).toLowerCase() === 'true';
    const optionalNumber = value => value !== '' && value !== null && value !== undefined && Number.isFinite(Number(value)) ? Number(value) : null;

    const formatNumber = value => {
      if (value === null || value === undefined || value === '') return '—';
      const n = Number(value);
      if (!Number.isFinite(n)) return String(value);
      if (n === 0) return '0';
      if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(2).replace(/\.00$/, '') + 'K';

      return n.toLocaleString(locale === 'ru' ? 'ru-RU' : 'en-GB', { maximumFractionDigits: 3 });
    };
    const formatMs = value => {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
      const n = Number(value);
      if (n >= 60000) return (n / 60000).toFixed(2) + ' ' + t('minute');
      if (n >= 1000) return (n / 1000).toFixed(2) + ' ' + t('second');
      return formatNumber(n) + ' ' + t('millisecond');
    };
    const formatBytes = kb => {
      const n = Number(kb);
      if (!Number.isFinite(n)) return '—';
      if (n >= 1048576) return (n / 1048576).toFixed(2) + ' ' + t('gigabyte');
      if (n >= 1024) return (n / 1024).toFixed(2) + ' ' + t('megabyte');
      return formatNumber(n) + ' ' + t('kilobyte');
    };

    function timeSeverity(percent) {
      return percent > 90 ? 4 : percent > 40 ? 3 : percent > 10 ? 2 : 0;
    }

    function estimateInfo(node) {
      if (!node.runtime?.hasRows) return null;
      const estimated = node.estimatedRows;
      const actual = actualRowsPerExecution(node);
      let factor = 1;
      let direction = '';
      if (actual > estimated) {
        direction = 'under';
        factor = estimated === 0 ? Infinity : actual / estimated;
      } else if (actual < estimated) {
        direction = 'over';
        factor = actual === 0 ? Infinity : estimated / actual;
      }
      const severity = factor > 1000 ? 4 : factor > 100 ? 3 : factor > 10 ? 2 : 0;
      return { estimated, actual, factor, direction, severity };
    }

    function actualRowsPerExecution(node) {
      const runtime = node.runtime;
      if (!runtime?.hasRows) return null;
      return runtime.hasExecutions && runtime.ActualExecutions > 0
        ? runtime.ActualRows / runtime.ActualExecutions
        : runtime.ActualRows;
    }

    function statementExecutionTime(statement) {
      const rootTimes = statement.roots.map(root => root.elapsed).filter(value => value !== null && value > 0);
      if (rootTimes.length) return Math.max(...rootTimes);
      return Math.max(...flatten(statement.roots).map(node => node.elapsed || 0), 0);
    }

    function performanceBadges(node, executionTime) {
      const badges = [];
      if (executionTime > 0 && node.selfTime !== null) {
        const percent = Math.round((node.selfTime / executionTime) * 100);

        if (severity) {
